<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tavola viva · Assonometrie</title>
<meta name="theme-color" content="#1f5c45">
<link rel="icon" type="image/png" sizes="32x32" href="icone/favicon-32.png">
<style>
/* Assonometrie (isometrica, cavaliera, monometrica): il solido in 3D e il disegno sul foglio 33 × 24, passaggio per passaggio */
:root{
  --desk:#cdd9d2;--chrome:#f5f8f6;--chrome-2:#e6eee9;--ink:#1d282b;--muted:#5b6b6f;--line:#cbdad1;
  --accent:#1f5c45;--accent-soft:#d3ebe0;
  --f-ui:"Avenir Next","Segoe UI","Helvetica Neue",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--ink);font-family:var(--f-ui);font-size:15px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#app{position:fixed;inset:0;display:grid;grid-template-columns:104px 1fr 210px;grid-template-rows:auto 1fr auto;background:var(--desk)}
#top{grid-column:1/4;display:flex;align-items:center;gap:10px;padding:7px 12px;padding-top:calc(7px + env(safe-area-inset-top,0px));background:var(--chrome);border-bottom:3px solid var(--accent);min-width:0;overflow-x:auto;scrollbar-width:none}
#top::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap}
.brand b{font-size:17px}.brand span{font-weight:600;color:var(--accent)}
.brand .logo{width:28px;height:28px;color:var(--accent);flex:none}
.spacer{flex:1 1 0;min-width:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;min-width:46px;padding:0 12px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:14.5px;touch-action:manipulation;text-decoration:none;color:inherit;box-sizing:border-box}
.btn:active{transform:translateY(1px)}
.btn.on,.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn[disabled]{opacity:.4;cursor:default}
.btn svg{width:22px;height:22px;flex:none}
.btn:focus-visible,.sol:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.test{font-size:12.5px;font-weight:700;color:#a6501a;background:#fbe9dc;border:1px solid #ecc9ae;border-radius:8px;padding:4px 8px;white-space:nowrap}

/* solidi a sinistra */
#solids{grid-row:2/4;background:var(--chrome);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:3px;padding:8px 6px;overflow-y:auto}
.h{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 4px 2px;text-align:center}
.sol{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px;padding:5px 2px;border:1px solid transparent;border-radius:10px;background:transparent;cursor:pointer;font-size:12px;font-weight:600;line-height:1.15;text-align:center;touch-action:manipulation;flex:none}
.sol svg{width:30px;height:30px}
.sol.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* foglio e solido 3D */
#stage{grid-row:2;grid-column:2;position:relative;overflow:hidden;min-width:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#stepBox{position:absolute;left:12px;top:12px;max-width:min(460px,calc(100% - 24px));padding:10px 14px;border-radius:12px;background:#fffffff2;border:1px solid var(--line);box-shadow:0 4px 18px #1d282b22;font-size:16px;line-height:1.4}
#stepBox b{display:block;color:var(--accent);font-size:17px;margin-bottom:3px}
#box3d{position:absolute;right:12px;top:12px;width:230px;height:230px;border-radius:12px;background:#fff;border:1px solid var(--line);box-shadow:0 4px 18px #1d282b22;overflow:hidden}
#box3d canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#box3d .cap{position:absolute;left:8px;top:6px;font-size:12px;font-weight:700;color:var(--muted);pointer-events:none}
#box3d .cap2{position:absolute;left:8px;bottom:6px;font-size:11.5px;color:var(--muted);pointer-events:none}
#warn{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);padding:10px 14px;border-radius:12px;background:#fde8e3;border:2px solid #d63a1f;color:#7a1d0c;font-size:15px;line-height:1.4;z-index:2;box-shadow:0 4px 18px #1d282b22}

/* opzioni a destra */
#side{grid-row:2/4;grid-column:3;background:var(--chrome);border-left:1px solid var(--line);overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
#side .ttl{font-weight:700;text-align:center;font-size:15px;padding:2px 0 6px;border-bottom:1px solid var(--line)}
.fld{display:flex;flex-direction:column;gap:3px}
.fld .k,.k2{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.step{display:grid;grid-template-columns:44px 1fr 44px;gap:4px;align-items:center}
.step button{min-height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:22px;font-weight:700;cursor:pointer;touch-action:manipulation}
.step .v{text-align:center;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.tog{min-height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:600;cursor:pointer;text-align:left;padding:0 10px;display:flex;align-items:center;gap:8px;touch-action:manipulation}
.tog::before{content:'';width:18px;height:18px;border-radius:5px;border:2px solid var(--line);flex:none;box-sizing:border-box}
.tog.on::before{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 2px #fff}
.sp{border-top:1px solid var(--line);margin:4px 0}
.typ{min-height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:700;cursor:pointer;text-align:left;padding:0 10px;touch-action:manipulation}
.typ.on{background:var(--accent);border-color:var(--accent);color:#fff}
.desc{font-size:13px;color:var(--muted);line-height:1.35}
.side-btn{min-height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:600;cursor:pointer;touch-action:manipulation;padding:4px 8px;line-height:1.2}
.side-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}

/* barra in basso: i passaggi */
#bottom{grid-row:3;grid-column:2;display:flex;align-items:center;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--chrome);border-top:1px solid var(--line);flex-wrap:wrap}
#stepLbl{flex:1 1 200px;min-width:140px;font-weight:700;font-size:16px;text-align:center}
#dots{display:flex;gap:5px;justify-content:center;margin-top:4px}
#dots i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
#dots i.on{background:var(--accent)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1c2126;color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;z-index:30;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}#toast.warn{background:#8a3b0d}
@media (max-width:1100px){#app{grid-template-columns:84px 1fr 180px}.sol{font-size:11px}.sol svg{width:26px;height:26px}.brand b{display:none}#box3d{width:170px;height:170px}}
</style>
</head><body>
<div id="app">
  <header id="top">
    <div class="brand"><svg class="logo" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 26a13 13 0 0 1 22 0" stroke-width="1.6" stroke-dasharray="2.5 2.5"/><path d="M16 4v3M16 7 9 26M16 7l7 19"/><circle cx="16" cy="8" r="2.2" fill="currentColor"/></svg><b>Tavola viva</b><span>· Assonometrie</span></div>
    <span class="test">In prova · non definitiva</span>
    <div class="spacer"></div>
    <button class="btn" id="pdfCon" title="Consegna per i ragazzi: il solido e le misure, senza soluzione">PDF consegna</button>
    <button class="btn" id="pdfSol" title="Consegna e soluzione: il disegno finito sul foglio">Consegna e soluzione</button>
    <button class="btn" id="pdfSteps" title="I passaggi, 4 per pagina A4">Passaggi in PDF</button>
    <button class="btn primary" id="tavBtn" title="Mette il disegno su un foglio di Tavola viva, con i passaggi già pronti">Porta in Tavola viva</button>
    <a class="btn" href="index.html" title="Torna alla tavola"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>Tavola</a>
    <button class="btn" id="fsBtn" title="Schermo intero"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </header>

  <nav id="solids" aria-label="Solidi">
    <div class="h">Tipo di solido</div>
    <button class="sol" data-s="parallelepipedo"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M5 11l7-5h15l-7 5zM5 11v15h15V11M20 26l7-5V6"/></svg>Parallele&shy;pipedo</button>
    <button class="sol" data-s="cubo"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M6 11l6-5h14l-6 5zM6 11v15h14V11M20 26l6-5V6"/></svg>Cubo</button>
    <button class="sol" data-s="prisma3"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M6 26h14l6-5M6 26l7-6 13 1M6 26V10l7-5v15M20 26V10L6 10M13 5l13 1v15M20 10l6-4"/></svg>Prisma triangolare</button>
    <button class="sol" data-s="prisma6"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M9 8h14l4 4-4 4H9l-4-4zM5 12v13l4 4h14l4-4V12M9 16v13M23 16v13"/></svg>Prisma esagonale</button>
    <button class="sol" data-s="piramide"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M16 4 4 24l9 4 15-4zM16 4l-3 24M16 4l12 20"/></svg>Piramide</button>
    <button class="sol" data-s="cilindro"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7"><ellipse cx="16" cy="8" rx="10" ry="4"/><path d="M6 8v16c0 2.2 4.5 4 10 4s10-1.8 10-4V8"/></svg>Cilindro</button>
    <button class="sol" data-s="cono"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M16 4 6 24M16 4l10 20"/><ellipse cx="16" cy="24" rx="10" ry="4"/></svg>Cono</button>
  </nav>

  <main id="stage">
    <canvas id="cv" aria-label="Il foglio con il disegno in assonometria"></canvas>
    <div id="stepBox" aria-live="polite"></div>
    <div id="box3d"><canvas id="c3" aria-label="Il solido in 3D: trascina per girarlo"></canvas><span class="cap">Il solido</span><span class="cap2">Trascina per girarlo</span></div>
    <div id="warn" hidden role="alert"></div>
  </main>

  <aside id="side" aria-label="Tipo, misure e opzioni"></aside>

  <div id="bottom">
    <button class="btn" id="prevBtn" title="Passaggio precedente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>Indietro</button>
    <div id="stepLbl"><span id="stepTxt"></span><div id="dots"></div></div>
    <button class="btn primary" id="nextBtn" title="Passaggio successivo">Avanti<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></button>
    <button class="btn" id="allBtn" title="Mostra il disegno finito">Disegno finito</button>
  </div>
  <div id="toast" role="status"></div>
  <input type="file" id="fileIn" accept=".pdf" hidden>
</div>

<script>
/* se qualcosa si rompe, lo si vede: una barra rossa in alto con l'errore (utile per capire i problemi sui computer della scuola) */
(() => { const show = m => { try { let b = document.getElementById('errbar'); if (!b) { b = document.createElement('div'); b.id = 'errbar'; b.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99;background:#b3261e;color:#fff;font:600 14px system-ui,sans-serif;padding:8px 12px;line-height:1.35'; (document.body || document.documentElement).appendChild(b); } b.innerHTML = ''; b.append('⚠ ' + m + ' '); const l = document.createElement('a'); l.href = 'ripara.html'; l.textContent = 'Apri Ripara'; l.style.cssText = 'margin-left:10px;display:inline-block;background:#fff;color:#b3261e;border-radius:6px;padding:2px 10px;text-decoration:none'; b.appendChild(l); } catch (_) { } };
  window.addEventListener('error', e => show('Errore: ' + (e.message || 'errore') + (e.lineno ? ' (riga ' + e.lineno + ')' : '') + '.'));
  setTimeout(() => { if (!window.__tvPronta) show('L’app non si è avviata bene. Prova a ricaricare la pagina; se non basta:'); }, 8000);
  window.addEventListener('unhandledrejection', e => show('Errore: ' + ((e.reason && e.reason.message) || String(e.reason)) + '.')); })();
</script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const DEG = Math.PI / 180, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = v => (Math.round(v * 100) / 100).toString().replace('.', ','); // fino ai centesimi
const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

/* ---------- tema, lo stesso scelto nella tavola ---------- */
const THEMES = {
  bosco: { accent: '#1f5c45', soft: '#d3ebe0', desk: '#cdd9d2', chrome: '#f5f8f6', chrome2: '#e6eee9', line: '#cbdad1' },
  petrolio: { accent: '#0a6873', soft: '#d6ecee', desk: '#c9d3d1', chrome: '#f5f7f6', chrome2: '#e9eeed', line: '#ccd7d5' },
  lavanda: { accent: '#6247aa', soft: '#e8e2f6', desk: '#d6d1e4', chrome: '#f8f6fc', chrome2: '#edeaf6', line: '#d9d2e8' }
};
let TH = THEMES.bosco;
try { TH = THEMES[JSON.parse(localStorage.getItem('tavolaviva.tema'))] || TH; } catch (_) { }
for (const [v, k] of [['--accent', 'accent'], ['--accent-soft', 'soft'], ['--desk', 'desk'], ['--chrome', 'chrome'], ['--chrome-2', 'chrome2'], ['--line', 'line']]) document.documentElement.style.setProperty(v, TH[k]);
document.querySelector('meta[name="theme-color"]').content = TH.accent;
const NEW = '#d9480f'; // colore delle linee del passaggio che si sta guardando

/* ---------- solidi e tipi di assonometria ----------
   Coordinate del solido (cm): x = larghezza, y = profondità, z = altezza; il solido sta in x ∈ [0, A], y ∈ [0, B], z ∈ [0, H].
   O è l'angolo in basso più vicino a chi guarda, da cui partono i tre assi. */
const KINDS = {
  parallelepipedo: { n: 'Parallelepipedo', art: 'il', dims: [['a', 'Larghezza', 6], ['b', 'Profondità', 4], ['h', 'Altezza', 5]] },
  cubo: { n: 'Cubo', art: 'il', dims: [['l', 'Spigolo', 5]] },
  prisma3: { n: 'Prisma triangolare', art: 'il', dims: [['l', 'Lato di base', 6], ['h', 'Altezza', 6]] },
  prisma6: { n: 'Prisma esagonale', art: 'il', dims: [['l', 'Lato di base', 3], ['h', 'Altezza', 6]] },
  piramide: { n: 'Piramide quadrata', art: 'la', dims: [['l', 'Lato di base', 6], ['h', 'Altezza', 7]] },
  cilindro: { n: 'Cilindro', art: 'il', dims: [['d', 'Diametro', 5], ['h', 'Altezza', 6]] },
  cono: { n: 'Cono', art: 'il', dims: [['d', 'Diametro', 6], ['h', 'Altezza', 7]] }
};
const c30 = Math.cos(30 * DEG), s30 = 0.5, c45 = Math.SQRT1_2;
// M: le due righe della proiezione (u verso destra, v verso l'alto); ky: riduzione sull'asse y; ang: angoli degli assi x e y sul foglio
const TYPES = {
  iso: { n: 'Isometrica', M: [[-c30, c30, 0], [s30, s30, 1]], ky: 1, ang: [150, 30],
    desc: 'Assi x e y a 30° dall’orizzontale, z verticale. Misure vere su tutti e tre gli assi.' },
  cav: { n: 'Cavaliera', M: [[1, 0.5 * c45, 0], [0, 0.5 * c45, 1]], ky: 0.5, ang: [0, 45],
    desc: 'La faccia davanti è in vera forma: x orizzontale, z verticale, y a 45° verso destra in alto. La profondità si dimezza.' },
  mono: { n: 'Monometrica', M: [[c30, -s30, 0], [s30, c30, 1]], ky: 1, ang: [30, 120],
    desc: 'Pianta vera ruotata: x a 30° e y a 60° dall’orizzontale, z verticale. Misure vere su tutti e tre gli assi.' }
};
const defDims = k => Object.fromEntries(KINDS[k].dims.map(d => [d[0], d[2]]));
const LS = 'tavolaviva.assonometrie';
const S = { kind: 'parallelepipedo', dims: {}, type: 'iso', hidden: false, labels: true, show3d: true, step: 0, yaw: 225, pitch: 35.26 };
if (location.hash === '#ripristina') { try { localStorage.removeItem(LS); } catch (_) { } history.replaceState(null, '', location.pathname); }
try { const o = JSON.parse(localStorage.getItem(LS)) || {}; Object.assign(S, o); } catch (_) { }
if (!KINDS[S.kind]) S.kind = 'parallelepipedo'; if (!TYPES[S.type]) S.type = 'iso'; if (!S.dims || typeof S.dims !== 'object') S.dims = {};
const dimsOf = () => S.dims[S.kind] || (S.dims[S.kind] = defDims(S.kind));
const saveS = () => { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (_) { } };

/* ---------- geometria ---------- */
const dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const sub3 = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = a => { const l = Math.hypot(...a) || 1; return a.map(v => v / l); };
// la base del solido (poligono in senso antiorario visto dall'alto) e l'ingombro A × B
function shape() {
  const d = dimsOf(), k = S.kind, r3 = Math.sqrt(3);
  if (k === 'parallelepipedo') return { A: d.a, B: d.b, H: d.h, base: [[0, 0], [d.a, 0], [d.a, d.b], [0, d.b]], top: 'prism' };
  if (k === 'cubo') return { A: d.l, B: d.l, H: d.l, base: [[0, 0], [d.l, 0], [d.l, d.l], [0, d.l]], top: 'prism' };
  if (k === 'prisma3') { const B = d.l * r3 / 2; return { A: d.l, B, H: d.h, base: [[0, 0], [d.l, 0], [d.l / 2, B]], top: 'prism' }; }
  if (k === 'prisma6') { const l = d.l, B = l * r3; return { A: 2 * l, B, H: d.h, base: [[l / 2, 0], [1.5 * l, 0], [2 * l, B / 2], [1.5 * l, B], [l / 2, B], [0, B / 2]], top: 'prism' }; }
  if (k === 'piramide') return { A: d.l, B: d.l, H: d.h, base: [[0, 0], [d.l, 0], [d.l, d.l], [0, d.l]], top: 'apex' };
  const r = d.d / 2, n = 48, base = Array.from({ length: n }, (_, i) => [r + r * Math.cos(i * 2 * Math.PI / n), r + r * Math.sin(i * 2 * Math.PI / n)]);
  return { A: d.d, B: d.d, H: d.h, r, base, top: k === 'cilindro' ? 'prism' : 'apex', round: true };
}
// facce con le normali verso l'esterno, e spigoli con le due facce vicine
function mesh(sh) {
  const H = sh.H, b = sh.base, n = b.length, F = [];
  const bot = b.map(p => [p[0], p[1], 0]);
  F.push(bot.slice().reverse());
  if (sh.top === 'prism') { const top = b.map(p => [p[0], p[1], H]); F.push(top); for (let i = 0; i < n; i++) { const j = (i + 1) % n; F.push([bot[i], bot[j], top[j], top[i]]); } }
  else { const c = sh.round ? [sh.r, sh.r] : [sh.A / 2, sh.B / 2], V = [c[0], c[1], H]; for (let i = 0; i < n; i++) F.push([bot[i], bot[(i + 1) % n], V]); }
  const cen = [sh.A / 2, sh.B / 2, H / 3], faces = F.map(P => {
    let nn = [0, 0, 0]; for (let i = 0; i < P.length; i++) { const a = P[i], q = P[(i + 1) % P.length]; nn[0] += (a[1] - q[1]) * (a[2] + q[2]); nn[1] += (a[2] - q[2]) * (a[0] + q[0]); nn[2] += (a[0] - q[0]) * (a[1] + q[1]); }
    nn = norm(nn); const fc = P.reduce((s, p) => [s[0] + p[0] / P.length, s[1] + p[1] / P.length, s[2] + p[2] / P.length], [0, 0, 0]);
    if (dot3(nn, sub3(fc, cen)) < 0) { nn = nn.map(v => -v); P = P.slice().reverse(); }

let toastT = 0;

const APP_URL = /^https?:$/.test(location.protocol) && !/claude\.ai|claudeusercontent/.test(location.hostname) ? location.origin + location.pathname : 'https://giulitecnologia.github.io/tavola-viva/assonometrie.html';

  const K = 50, PW = 29.7, PH = 21, mg = 1.2, c = document.createElement('canvas'); c.width = PW * K; c.height = PH * K; const g = c.getContext('2d'), ff = FF();
  g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.textBaseline = 'alphabetic'; g.textAlign = 'left';
  g.fillStyle = '#1c2126'; g.font = `700 ${0.75 * K}px ${ff}`; g.fillText(title(), mg * K, 1.8 * K);
  g.fillStyle = TH.accent; g.font = `600 ${0.42 * K}px ${ff}`; g.fillText('Assonometrie · consegna', mg * K, 2.55 * K);

  let x = (mg + aw + 1) * K; y += 1.2 * K; g.fillStyle = TH.accent; g.font = `700 ${0.5 * K}px ${ff}`; g.fillText('Misure', x, y); y += 0.8 * K;
  g.fillStyle = '#1c2126'; g.font = `400 ${0.45 * K}px ${ff}`; for (const m of measures()) { g.fillText(m, x, y); y += 0.7 * K; }

function stepsPages() { // 4 passaggi per pagina A4 orizzontale, numerati

function jpegBytes(c) { const d = atob(c.toDataURL('image/jpeg', 0.92).split(',')[1]), u = new Uint8Array(d.length); for (let i = 0; i < d.length; i++) u[i] = d.charCodeAt(i); return u; }

async function openBuf(buf) {

/* ---------- Porta in Tavola viva: il disegno diventa segni veri, con un passaggio per ogni fase ---------- */
function toTavola() {
