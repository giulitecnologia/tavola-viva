<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tavola viva</title>
<meta name="theme-color" content="#1f5c45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tavola viva">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icone/favicon-32.png">
<link rel="apple-touch-icon" href="icone/apple-touch-icon.png">
<style>
/* Layout: banco da disegno — barra superiore essenziale, palette verticale a sinistra, foglio al centro su piano grigio-verde; tema chiaro unico, pensato per la proiezione sulla LIM */
:root{
  --desk:#cdd9d2;       /* piano del tavolo (cambia col tema) */
  --chrome:#f5f8f6;     /* barre */
  --chrome-2:#e6eee9;
  --ink:#1d282b;
  --muted:#5b6b6f;
  --line:#cbdad1;
  --accent:#1f5c45;     /* colore dei comandi e degli strumenti (cambia col tema) */
  --accent-soft:#d3ebe0;
  --warn:#a6501a;
  --warn-soft:#fbe9dc;
  --ok:#2e7d4f;
  --f-ui:"Avenir Next","Segoe UI","Helvetica Neue",system-ui,sans-serif;
  --f-tec:"Arial Narrow","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--ink);font-family:var(--f-ui);font-size:15px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#app{position:fixed;inset:0;display:grid;grid-template-columns:96px 1fr;grid-template-rows:auto 1fr;background:var(--desk)}

/* ---------- barra superiore ---------- */
#top{grid-column:1/3;display:flex;align-items:center;gap:10px;padding:7px 12px;padding-top:calc(7px + env(safe-area-inset-top,0px));background:var(--chrome);border-bottom:3px solid var(--accent);min-width:0;overflow-x:auto;scrollbar-width:none}
#top::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:baseline;gap:6px;font-weight:700;letter-spacing:.01em;white-space:nowrap;padding-right:6px}
.brand b{font-size:17px}
.brand .logo{width:28px;height:28px;color:var(--accent);align-self:center;flex:none}
.sw{display:inline-block;width:18px;height:18px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #0003}
.chip.on .sw{box-shadow:0 0 0 2px #fff}
.grp{display:flex;align-items:center;gap:4px;flex:none}
.sep{width:1px;align-self:stretch;background:var(--line);flex:none;margin:4px 2px}
.spacer{flex:1 1 0;min-width:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;min-width:46px;padding:0 11px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:14.5px;touch-action:manipulation}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.pal:focus-visible,.chip:focus-visible,.key:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.38;cursor:default}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent}
.btn svg{width:22px;height:22px;flex:none}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg .btn{border:0;border-radius:0;min-height:44px}
.seg .btn+.btn{border-left:1px solid var(--line)}
.pen-sw{display:inline-block;width:22px;border-radius:2px;background:currentColor}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-variant-numeric:tabular-nums}
.btn.on .badge,.btn.primary .badge{background:#ffffff33;color:#fff}
#exBar{gap:8px}
#exLbl{padding-left:7px}
.exlbl{font-weight:700;color:var(--accent);white-space:nowrap;max-width:90px;overflow:hidden;text-overflow:ellipsis}
#stepView{display:flex;align-items:center;gap:6px;background:var(--warn-soft);border:1px solid #e9c4a8;border-radius:12px;padding:3px 6px}
#stepView .lbl{font-weight:700;color:var(--warn);padding:0 6px;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---------- palette ---------- */
#palette{grid-row:2;background:var(--chrome);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:8px 6px;overflow-y:auto;scrollbar-width:thin}
.pal-h{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:5px 4px 1px;text-align:center}
.pal{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;padding:4px 2px;flex:none;border:1px solid transparent;border-radius:10px;background:transparent;cursor:pointer;font-size:12.5px;font-weight:600;line-height:1.1;text-align:center;touch-action:manipulation}
.pal svg{width:27px;height:27px;flex:none}
.pal:active{background:var(--chrome-2)}
.pal.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pal.add{border-color:var(--line);background:#fff}

/* ---------- area di lavoro ---------- */
#stage{grid-row:2;position:relative;overflow:hidden;min-width:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#viewbar{position:absolute;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));width:132px;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;padding:8px;background:#fffffff2;border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px #1d282b26}
#viewbar .chip{width:100%;justify-content:center;padding:0 6px}
#viewbar .g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#viewbar .zl{font-size:12px;text-align:center;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
#ctxbar{position:absolute;right:8px;top:8px;width:132px;box-sizing:border-box;display:flex;flex-direction:column;align-items:stretch;gap:6px;max-height:calc(100% - 196px);overflow-y:auto;padding:8px;background:#fffffff2;border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px #1d282b26}
#ctxbar .ttl{font-weight:700;text-align:center;font-size:14.5px;line-height:1.2;padding:2px 0 4px;border-bottom:1px solid var(--line)}
#ctxbar .hint{color:var(--muted);font-size:12.5px;line-height:1.35;text-align:center}
#ctxbar .lbl{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:center;margin-top:6px}
#ctxbar .seg{flex-direction:column}
#ctxbar .seg .btn{width:100%}
#ctxbar .seg .btn+.btn{border-left:0;border-top:1px solid var(--line)}
#ctxbar .chip,#ctxbar .numbox{width:100%;justify-content:center;padding:0 6px}
#ctxbar .g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#ctxbar .sp{height:4px;border-top:1px solid var(--line);margin-top:4px}
#ctxbar .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#ctxbar .csw{height:36px;border-radius:9px;border:2px solid #fff;box-shadow:0 0 0 1px #0003;cursor:pointer;touch-action:manipulation}
#ctxbar .csw.on{box-shadow:0 0 0 3px var(--accent)}
#ctxbar input[type=range]{width:100%;height:34px;margin:0;accent-color:var(--accent);touch-action:none}
#ctxbar .val{text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.field{display:flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap}
.numbox{min-width:84px;min-height:46px;padding:0 12px;border:2px solid var(--accent);border-radius:10px;background:#fff;font:700 20px/1 var(--f-ui);font-variant-numeric:tabular-nums;cursor:pointer;color:var(--ink)}
.numbox.dim{border-color:var(--line);color:var(--muted)}
.chip{min-height:44px;min-width:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;gap:6px;touch-action:manipulation}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mod{display:inline-block;border:1.5px solid currentColor;background:repeating-linear-gradient(0deg,transparent 0 5px,#0000 5px)}
#banner{position:absolute;left:12px;top:12px;padding:8px 12px;border-radius:10px;background:var(--warn);color:#fff;font-weight:700;font-size:14px;pointer-events:none}
#banner.ex{background:var(--accent)}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);max-width:min(560px,calc(100% - 24px));padding:10px 16px;border-radius:12px;background:var(--ink);color:#fff;font-weight:600;font-size:15px;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5}
#toast.show{opacity:1}
#toast.warn{background:var(--warn)}

/* ---------- pannelli ---------- */
.backdrop{position:fixed;inset:0;background:#1d282b40;z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--chrome);z-index:21;box-shadow:-10px 0 40px #1d282b33;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.drawer header h2{margin:0;font-size:20px}
.drawer .body{overflow-y:auto;padding:8px 16px 24px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-direction:column;gap:8px}
.row>.k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.row .wrap{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.note{font-size:13.5px;line-height:1.45;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.note.warn{color:#6d3510;background:var(--warn-soft);border-color:#ecc9ae}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 6px 6px 12px}
.item .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .dt{font-size:12px;color:var(--muted);font-weight:400}
.empty{color:var(--muted);font-size:14px}

/* ---------- tastierini ---------- */
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:#1d282b55;padding:16px}
.pad{background:var(--chrome);border-radius:18px;padding:16px;box-shadow:0 20px 60px #0004;width:min(360px,100%);display:flex;flex-direction:column;gap:10px}
.pad.wide{width:min(720px,100%)}
.pad h3{margin:0;font-size:17px}
.disp{min-height:62px;display:flex;align-items:center;justify-content:flex-end;padding:0 16px;border:2px solid var(--accent);border-radius:12px;background:#fff;font:700 32px/1 var(--f-ui);font-variant-numeric:tabular-nums;overflow:hidden;white-space:nowrap}
.disp.txt{justify-content:flex-start;font-size:26px}
.disp .cur{display:inline-block;width:2px;height:1em;background:var(--accent);margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.disp .cur{animation:none}#toast{transition:none}}
.err{min-height:20px;color:var(--warn);font-weight:600;font-size:14px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys.alpha{grid-template-columns:repeat(10,1fr);gap:6px}
.key{min-height:58px;border:1px solid var(--line);border-radius:12px;background:#fff;font:700 24px/1 var(--f-ui);cursor:pointer;touch-action:manipulation}
.keys.alpha .key{min-height:52px;font-size:20px}
.key:active{background:var(--accent-soft)}
.key.fn{font-size:16px;background:var(--chrome-2)}
.key.ok{background:var(--accent);border-color:var(--accent);color:#fff;font-size:17px}
.key.span2{grid-column:span 2}.key.span3{grid-column:span 3}.key.span4{grid-column:span 4}
.padrow{display:flex;gap:8px}
.padrow .key{flex:1}
@media (max-width:1800px){.hide-m{display:none}#top{gap:7px}}
#top .show-l{display:none}
@media (max-width:1180px){.hide-l{display:none}#top .show-l{display:block}#top .btn{padding:0 9px}}
@media (max-width:640px){#app{grid-template-columns:76px 1fr}.pal{font-size:11px}.pal svg{width:26px;height:26px}.brand small,.hide-s{display:none}}
</style>
</head><body>
<div id="app">
  <header id="top">
    <div class="brand"><svg class="logo" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 26a13 13 0 0 1 22 0" stroke-width="1.6" stroke-dasharray="2.5 2.5"/><path d="M16 4v3M16 7 9 26M16 7l7 19"/><circle cx="16" cy="8" r="2.2" fill="currentColor"/></svg><b>Tavola viva</b><small id="docName" hidden></small></div>
    <div class="grp" id="exBar" hidden><span class="exlbl hide-m" id="exLbl">Esempio</span><button class="btn primary" id="exBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>Chiudi esempio</button></div>
    <div class="sep"></div>
    <div class="grp" id="penGrp">
      <div class="seg" role="group" aria-label="Matita">
        <button class="btn" id="pen2H" data-pen="2H" title="Matita 2H, tratto sottile di costruzione"><span class="pen-sw" style="height:1.5px;color:#8794a0"></span>2H<span class="hide-m" style="font-weight:500">· Costruzione</span></button>
        <button class="btn" id="penHB" data-pen="HB" title="Matita HB, tratto marcato per i contorni"><span class="pen-sw" style="height:3px;color:#1c2126"></span>HB<span class="hide-m" style="font-weight:500">· Contorni</span></button>
      </div>
      <button class="btn" id="dashBtn" title="Tratto tratteggiato"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="butt"><path d="M2 12h4M9 12h4M16 12h4"/></svg><span class="hide-m">Tratteggio</span></button>
    </div>
    <div class="spacer"></div>
    <div class="grp" id="undoGrp">
      <button class="btn" id="undoBtn" title="Annulla (⌘Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg><span class="hide-m">Annulla</span></button>
      <button class="btn" id="redoBtn" title="Ripristina (⇧⌘Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg><span class="hide-m">Ripristina</span></button>
    </div>
    <div class="sep"></div>
    <div class="grp" id="stepNormal">
      <button class="btn" id="markBtn" title="Registra lo stato attuale della tavola"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Segna<span class="hide-l">passaggio</span></button>
      <button class="btn" id="stepsBtn" title="Mostra i passaggi registrati"><span class="hide-l">Passaggi</span><svg class="show-l" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 5h16M4 12h16M4 19h10"/></svg> <span class="badge" id="stepCount">0</span></button>
    </div>
    <div class="grp" id="stepView" hidden>
      <button class="btn" id="prevStep"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>Indietro</button>
      <span class="lbl" id="stepLbl">Passaggio 1 di 1</span>
      <button class="btn" id="nextStep">Avanti<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></button>
      <button class="btn primary" id="resumeBtn">Riprendi disegno</button>
      <button class="btn ghost" id="delStep" title="Elimina questo passaggio">Elimina</button>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <button class="btn" id="saveBtn" title="Salva la tavola su questo dispositivo (Ctrl+S)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/></svg>Salva</button>
      <button class="btn" id="newBtn" title="Foglio bianco nuovo: il lavoro attuale resta in Tavole"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M6 3h8l4 4v14H6z"/><path d="M12 11v6M9 14h6"/></svg>Nuovo<span class="hide-l">foglio</span></button>
      <button class="btn" id="sheetBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="1"/><rect x="6" y="8" width="12" height="8" stroke-width="1.4"/></svg>Foglio</button>
      <button class="btn" id="boardsBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 6h6l2 2h8v11H4z"/></svg>Tavole</button>
      <button class="btn" id="fsBtn" title="Schermo intero"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </header>

  <nav id="palette" aria-label="Strumenti">
    <div class="pal-h">Strumenti</div>
    <button class="pal add" data-add="righello"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="11" width="28" height="10" rx="1"/><path d="M6 11v4M10 11v3M14 11v4M18 11v3M22 11v4M26 11v3"/></svg>Righello</button>
    <button class="pal add" data-add="riga"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="1.5" y="13" width="29" height="6" rx="1"/></svg>Riga</button>
    <button class="pal add" data-add="sq45"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M5 27V5l22 22z"/><path d="M10 22V17l5 5z" stroke-width="1.2"/></svg>Squadra 45°</button>
    <button class="pal add" data-add="sq3060"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 27V12l26 15z"/><path d="M8 24v-5l9 5z" stroke-width="1.2"/></svg>Squadra 30°/60°</button>
    <button class="pal add" data-add="compasso"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M16 3v4M16 7 7 28M16 7l8 18"/><circle cx="16" cy="8" r="2"/><path d="m24 25 1 3" stroke-width="2.6"/></svg>Compasso</button>
    <div class="pal-h">Azioni</div>
    <button class="pal" data-mode="sposta"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4v24M4 16h24M12 8l4-4 4 4M12 24l4 4 4-4M8 12l-4 4 4 4M24 12l4 4-4 4"/></svg>Sposta</button>
    <button class="pal" data-mode="segmento"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 25 26 7"/><circle cx="6" cy="25" r="2.4" fill="currentColor"/><circle cx="26" cy="7" r="2.4" fill="currentColor"/></svg>Segmento</button>
    <button class="pal" data-mode="punto"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="16" cy="16" r="4" fill="currentColor"/><path d="M16 5v4M16 23v4M5 16h4M23 16h4" stroke-linecap="round"/></svg>Punto</button>
    <button class="pal" data-mode="matita"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 26l2-7L22 5l5 5-14 14z"/><path d="m19 8 5 5M6 26l7-2"/></svg>Matita</button>
    <button class="pal" data-mode="colore"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 15 15 6l10 10-9 9z" fill="currentColor" fill-opacity=".25"/><path d="M15 6 12 3M25 16c1.5 2.5 3 4.5 3 6a3 3 0 0 1-6 0c0-1.5 1.5-3.5 3-6z"/></svg>Colore</button>
    <button class="pal" data-mode="gomma"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 27 4 19 18 5l10 10-12 12z"/><path d="m10 13 10 10M12 27h16"/></svg>Gomma</button>
    <button class="pal" data-mode="lettere"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 26 15 6h2l8 20M10.5 18h11"/></svg>Lettere</button>
  </nav>

  <main id="stage">
    <canvas id="cv" aria-label="Foglio da disegno"></canvas>
    <div id="banner" hidden></div>
    <div id="ctxbar" hidden></div>

let tp = null;

function renderText() { const esc = tp.s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); $('#tpDisp').innerHTML = esc + '<span class="cur"></span>'; }

  const box = $('#tpKeys'); box.innerHTML = '';

  for (const r of rows) for (const ch of r) { const b = document.createElement('button'); b.className = 'key'; const c = tp.shift ? ch : ch.toLowerCase(); b.textContent = c; b.dataset.c = c; box.appendChild(b); }

  if (!tp.numeric) { mk(tp.shift ? 'MAIUSC' : 'minusc.', 'shift', 'fn span2'); mk('àèéìòù', 'acc', 'fn span2'); mk('Spazio', 'sp', 'fn span2'); }
  mk('⌫', 'del', 'fn'); mk('Annulla', 'esc', 'fn span' + (tp.numeric ? '4' : '1')); mk('Conferma', 'ok', 'ok span' + (tp.numeric ? '5' : '2'));
}
function textKey(c, f) {
  if (!tp) return;
  if (c) tp.s += c;
  else if (f === 'del') tp.s = tp.s.slice(0, -1);
  else if (f === 'sp') tp.s += ' ';
  else if (f === 'shift') { tp.shift = !tp.shift; buildAlpha(); }
  else if (f === 'acc') { const m = { a: 'à', e: 'è', i: 'ì', o: 'ò', u: 'ù', A: 'À', E: 'È', I: 'Ì', O: 'Ò', U: 'Ù', 'è': 'é', 'È': 'É' }; const l = tp.s.slice(-1); if (m[l]) tp.s = tp.s.slice(0, -1) + m[l]; }
  else if (f === 'esc') { closeText(); return; }
  else if (f === 'ok') { const cb = tp.onOk, v = tp.s; closeText(); cb(v); return; }

}

  if (np) {
    if (/^[0-9]$/.test(e.key)) numKey(e.key); else if (e.key === ',' || e.key === '.') numKey(',');
    else if (e.key === 'Backspace') numKey('del'); else if (e.key === 'Enter') numKey('ok'); else if (e.key === 'Escape') numKey('esc');
    e.preventDefault(); return;
  }
  if (tp) {
    if (e.metaKey || e.ctrlKey) return;
    if (e.key.length === 1) textKey(e.key); else if (e.key === 'Backspace') textKey(null, 'del'); else if (e.key === 'Enter') textKey(null, 'ok'); else if (e.key === 'Escape') textKey(null, 'esc');

  }

  const kind = b.dataset.add, { w, h } = sheetDims(D.sheet), m = D.sheet.frame ? D.sheet.margin : 0.5, off = (addCount++ % 4) * 1.2;
  const last = (lsGet(LS.last) || {})[kind];
  let t = mkTool(kind, last ? clone(last) : null);
  if (SQMIN[kind] && !(t.len >= SQMIN[kind])) t.len = SQMIN[kind];
  const c = t.kind === 'compasso' ? { x: t.x, y: t.y } : toW(t, centroidL(t));
  if (!last || c.x < 0 || c.y < 0 || c.x > w || c.y > h) { // prima volta, o il foglio è cambiato: posizione comoda
    t = mkTool(kind, kind === 'compasso' && last ? { r: last.r, s: last.s } : null);

function sampleDoc(kind) {
  const d = newDoc(); d.sheet = defaultSheet(); d.header.numero = '';
  const steps = [], line = (a, b, pen, dash) => ({ id: uid(), type: 'line', x1: r3(a.x), y1: r3(a.y), x2: r3(b.x), y2: r3(b.y), pen: pen || 'HB', dash: !!dash });
  const arc = (c, r, a0, a1, pen) => ({ id: uid(), type: 'arc', cx: c.x, cy: c.y, r, a0: a0 * DEG, sw: (a1 - a0) * DEG, pen: pen || '2H', dash: false });
  const txt = (s, p) => ({ id: uid(), type: 'text', text: s, x: r3(p.x), y: r3(p.y), size: TXT_EM, bold: false, pen: 'HB', dash: false });
  const snap = () => steps.push(clone({ id: uid(), at: Date.now(), sheet: d.sheet, header: d.header, strokes: d.strokes, tools: d.tools }));
  if (kind === 'asse') {
    d.name = 'Asse di un segmento'; const A = { x: 11, y: 15 }, B = { x: 21, y: 15 };
    d.tools = [mkTool('righello', { x: 10.4, y: 15, len: 20 })]; d.strokes.push(line(A, B, 'HB'), txt('A', { x: 10.5, y: 14.5 }), txt('B', { x: 21.1, y: 14.5 })); snap();
    d.tools = [mkTool('compasso', { x: 11, y: 15, r: 7, ang: 60 * DEG })]; d.strokes.push(arc(A, 7, -60, -30), arc(A, 7, 30, 60)); snap();
    d.tools = [mkTool('compasso', { x: 21, y: 15, r: 7, ang: 240 * DEG })]; d.strokes.push(arc(B, 7, 120, 150), arc(B, 7, 210, 240)); snap();
    d.tools = [mkTool('riga', { x: 16, y: 7, rot: Math.PI / 2, len: 16 })]; d.strokes.push(line({ x: 16, y: 8 }, { x: 16, y: 22 }, 'HB')); snap();
    d.tools = []; d.strokes.push(txt('M', { x: 16.2, y: 15.6 }), txt('a', { x: 16.3, y: 8.6 })); snap();
  } else if (kind === 'triangolo') {
    d.name = 'Triangolo equilatero inscritto'; const O = { x: 16.5, y: 12 }, r = 6, A = { x: 16.5, y: 6 }, Dp = { x: 16.5, y: 18 };
    const B = { x: 16.5 + r * Math.sqrt(3) / 2, y: 15 }, C = { x: 16.5 - r * Math.sqrt(3) / 2, y: 15 };
    const mark = p => ({ id: uid(), type: 'mark', x: p.x, y: p.y, size: 0.25, pen: '2H', dash: false });
    d.tools = [mkTool('compasso', { x: O.x, y: O.y, r: 6, ang: -0.4 })]; d.strokes.push(arc(O, 6, 0, 360), mark(O), txt('O', { x: 16.7, y: 11.7 })); snap();
    d.tools = [mkTool('riga', { x: 16.5 + GW, y: 4.5, rot: Math.PI / 2, len: 16 })]; d.strokes.push(line(A, Dp, '2H'), txt('A', { x: 16.7, y: 5.6 }), txt('D', { x: 16.7, y: 18.8 })); snap();
    d.tools = [mkTool('compasso', { x: Dp.x, y: Dp.y, r: 6, ang: -100 * DEG })]; d.strokes.push(arc(Dp, 6, 200, 340)); snap();
    d.strokes.push(txt('B', { x: B.x + 0.25, y: B.y + 0.1 }), txt('C', { x: C.x - 0.6, y: C.y + 0.1 })); d.tools = []; snap();
    const rB = mkTool('riga', { x: 0, y: 0, len: 16 }); { const dd = unit(sub(B, A)); rB.rot = Math.atan2(dd.y, dd.x); const st = sub(A, mul(dd, 2)); rB.x = st.x; rB.y = st.y; }
    d.tools = [rB]; d.strokes.push(line(A, B, 'HB')); snap();
    d.tools = []; d.strokes.push(line(B, C, 'HB'), line(C, A, 'HB')); snap();
  } else if (kind === 'esagono') {
    d.name = 'Esagono regolare'; const O = { x: 16.5, y: 12 }, r = 6, P = k => ({ x: O.x + r * Math.cos(-k * 60 * DEG), y: O.y + r * Math.sin(-k * 60 * DEG) });
    d.tools = [mkTool('righello', { x: 8.9, y: 12, len: 16 })]; d.strokes.push(line({ x: 9.5, y: 12 }, { x: 23.5, y: 12 }, '2H'), txt('O', { x: 16.6, y: 12.7 })); snap();
    d.tools = [mkTool('compasso', { x: O.x, y: O.y, r: 6, ang: -30 * DEG })]; d.strokes.push(arc(O, 6, 0, 360)); snap();
    d.tools = [mkTool('compasso', { x: P(0).x, y: P(0).y, r: 6, ang: 240 * DEG })]; d.strokes.push(arc(P(0), 6, 100, 260)); snap();
    d.tools = [mkTool('compasso', { x: P(3).x, y: P(3).y, r: 6, ang: 80 * DEG })]; d.strokes.push(arc(P(3), 6, -80, 80)); snap();
    d.tools = [mkTool('riga', { x: P(0).x, y: P(0).y, rot: 240 * DEG, len: 10 })];
    const L = ['A', 'B', 'C', 'D', 'E', 'F'];
    for (let k = 0; k < 6; k++) { d.strokes.push(line(P(k), P(k + 1), 'HB')); const q = add(O, mul(unit(sub(P(k), O)), r + 0.55)); d.strokes.push(txt(L[k], { x: q.x - 0.17, y: q.y + 0.2 })); }
    snap(); d.tools = []; snap();
  } else {
    d.name = 'Parallele con due squadre'; d.sheet.fmt = '48x33';
    // guida: squadra 30°/60° in piedi, con il cateto lungo verticale (x = 20); la squadra 45° scorre lungo di essa
    const g = mkTool('sq3060', { x: 20, y: 32.75, rot: -Math.PI / 2, locked: true });
    const sl = y => mkTool('sq45', { x: 20, y });
    d.tools = [g, sl(23)]; snap();
    for (const [y, pen] of [[23, 'HB'], [27, '2H'], [31, 'HB']]) { const t2 = sl(y); d.tools = [g, t2]; const e = edges(t2)[1]; d.strokes.push(line(e.a, e.b, pen)); snap(); }
    d.tools = [g]; snap();
  }
  d.steps = steps; d.tools = clone(steps[steps.length - 1].tools); return d;
}

/* ================= vista: ingrandimento e tratto LIM ================= */
function setZoom(z, at) {
  z = clamp(z, 1, 6); const old = { s: V.s, ox: V.ox, oy: V.oy }, z0 = U.zoom || 1;
  let sc = null; if (at) sc = { x: old.ox + at.x * old.s, y: old.oy + at.y * old.s };
  U.zoom = z; layout();
  if (at && z > 1.001) { U.cx += (V.ox + at.x * V.s - sc.x) / V.s; U.cy += (V.oy + at.y * V.s - sc.y) / V.s; layout(); }
  renderView();
  if (z !== z0) toast(z <= 1.001 ? 'Foglio intero' : 'Ingrandimento ' + Math.round(z * 100) + '%. Trascina il foglio vuoto (con Sposta) per spostarti.');
}
function zoomCenter() { const t = selTool(); return t ? (t.kind === 'compasso' ? { x: t.x, y: t.y } : toW(t, centroidL(t))) : null; }
$('#zoomIn').onclick = () => setZoom((U.zoom || 1) * 1.5, (U.zoom || 1) <= 1.001 ? zoomCenter() : null);
$('#zoomOut').onclick = () => setZoom((U.zoom || 1) / 1.5);
$('#zoomFit').onclick = () => setZoom(1);
cv.addEventListener('wheel', e => {
  e.preventDefault(); if (U.view >= 0 && !e.ctrlKey && (U.zoom || 1) <= 1.001) return;
  const r = cv.getBoundingClientRect(), at = { x: (e.clientX - r.left - V.ox) / V.s, y: (e.clientY - r.top - V.oy) / V.s };
  if (e.ctrlKey) setZoom((U.zoom || 1) * Math.exp(-e.deltaY * 0.01), at); // pizzico sul trackpad
  else if ((U.zoom || 1) > 1.001) { U.cx += e.deltaX / V.s; U.cy += e.deltaY / V.s; layout(); }
}, { passive: false });
U.lim = !!lsGet(LS.lim);
function renderView() { $('#limBtn').classList.toggle('on', U.lim); $('#zoomFit').classList.toggle('on', (U.zoom || 1) > 1.001); $('#zoomOut').disabled = (U.zoom || 1) <= 1.001; }
$('#limBtn').onclick = () => { U.lim = !U.lim; lsSet(LS.lim, U.lim); renderView(); draw(); toast(U.lim ? 'Tratto LIM: tratti più spessi e scuri sullo schermo. Le immagini esportate restano normali.' : 'Tratto normale'); };
renderView();

/* ================= schermo intero ================= */
$('#fsBtn').onclick = () => {
  const el = document.documentElement, fs = document.fullscreenElement || document.webkitFullscreenElement;
  try {
    if (fs) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else { const r = (el.requestFullscreen || el.webkitRequestFullscreen).call(el); if (r && r.catch) r.catch(() => toast('Schermo intero non disponibile in questa finestra. Nel file scaricato funziona.', 'warn')); }
  } catch (_) { toast('Schermo intero non disponibile in questa finestra.', 'warn'); }
};

/* ================= avvio ================= */
new ResizeObserver(layout).observe(stage);
window.addEventListener('resize', layout);
window.addEventListener('pagehide', () => { clearTimeout(saveTimer); kvSet(LS.auto, D); });
(async function init() {
  await kvLoad([LS.auto, LS.boards, LS.esempi, LS.prev]);
  const a = kvGet(LS.auto);
  if (a && a.app === 'tavolaviva' && Array.isArray(a.strokes)) { loadDoc(a); if (a.strokes.length || a.tools.length) toast('Ripreso l\'ultimo lavoro salvato in questo browser'); }
  else {
    D = newDoc(); D.tools.push(mkTool('righello', { x: 3, y: 18, len: 20 })); D.tools.push(mkTool('compasso', { x: 18, y: 12, r: 4, ang: 0 }));
    layout(); changed();
  }
  renderTop(); renderCtx();
})();

/* app installabile: sul sito si può installare come un'app e funziona anche senza internet */
if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude\.ai|claudeusercontent/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => { });

/* interfaccia di prova per le verifiche automatiche */
window.TV = { exportSteps, makePDF, exportPDF, exportStepsPDF, setZoom, lineTargets, openExample, backToSheet, get D() { return D; }, U, get V() { return V; }, edges, cgeom, sheetDims, renderToCanvas, loadDoc, sampleDoc, snapPts };
})();
