<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tavola viva · Proiezioni</title>
<meta name="theme-color" content="#1f5c45">
<link rel="icon" type="image/png" sizes="32x32" href="icone/favicon-32.png">
<style>
/* Proiezioni ortogonali nel triedro di Monge: il solido nel triedro, le proiezioni sui tre piani e l'apertura dei piani fino al disegno 2D */
:root{
  --desk:#cdd9d2;--chrome:#f5f8f6;--chrome-2:#e6eee9;--ink:#1d282b;--muted:#5b6b6f;--line:#cbdad1;
  --accent:#1f5c45;--accent-soft:#d3ebe0;
  --f-ui:"Avenir Next","Segoe UI","Helvetica Neue",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--ink);font-family:var(--f-ui);font-size:15px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#app{position:fixed;inset:0;display:grid;grid-template-columns:104px 1fr 190px;grid-template-rows:auto 1fr auto;background:var(--desk)}
#top{grid-column:1/4;display:flex;align-items:center;gap:10px;padding:7px 12px;padding-top:calc(7px + env(safe-area-inset-top,0px));background:var(--chrome);border-bottom:3px solid var(--accent);min-width:0;overflow-x:auto;scrollbar-width:none}
#top::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap}
.brand b{font-size:17px}.brand span{font-weight:600;color:var(--accent)}
.brand .logo{width:28px;height:28px;color:var(--accent);flex:none}
.spacer{flex:1 1 0;min-width:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;min-width:46px;padding:0 12px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:14.5px;touch-action:manipulation;text-decoration:none;color:inherit;box-sizing:border-box}
.btn:active{transform:translateY(1px)}
.btn.on,.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn svg{width:22px;height:22px;flex:none}
.btn:focus-visible,.sol:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.test{font-size:12.5px;font-weight:700;color:#a6501a;background:#fbe9dc;border:1px solid #ecc9ae;border-radius:8px;padding:4px 8px;white-space:nowrap}

/* solidi a sinistra */
#solids{grid-row:2/4;background:var(--chrome);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:3px;padding:8px 6px;overflow-y:auto}
.h{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 4px 2px;text-align:center}
.sol{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px;padding:5px 2px;border:1px solid transparent;border-radius:10px;background:transparent;cursor:pointer;font-size:12px;font-weight:600;line-height:1.15;text-align:center;touch-action:manipulation;flex:none}
.sol svg{width:30px;height:30px}
.sol.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* area 3D */
#stage{grid-row:2;grid-column:2;position:relative;overflow:hidden;min-width:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:grab}
#beta{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;max-width:calc(100% - 24px);padding:8px 8px 8px 14px;border-radius:12px;background:#fbe9dc;border:1px solid #ecc9ae;color:#6d3510;font-size:14px;font-weight:600;box-shadow:0 4px 16px #0001;z-index:2}
#beta button{min-height:36px;padding:0 12px;border:1px solid #ecc9ae;border-radius:9px;background:#fff;font-weight:700;cursor:pointer;color:#6d3510}
#legend{position:absolute;left:12px;top:12px;max-width:min(300px,calc(100% - 24px));max-height:calc(100% - 70px);overflow:auto;padding:10px 12px;border-radius:12px;background:#fffffff2;border:1px solid var(--line);box-shadow:0 4px 18px #1d282b22;font-size:14px;line-height:1.4;pointer-events:none}
#legend b.t{display:block;color:var(--accent);margin-bottom:4px}#legend .s{margin-top:6px}#legend .s:first-of-type{margin-top:0}#legend .n{font-weight:700}#legend .r{color:var(--muted);font-size:13px}
#warn{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);padding:10px 14px;border-radius:12px;background:#fde8e3;border:2px solid #d63a1f;color:#7a1d0c;font-size:15px;line-height:1.4;z-index:2;box-shadow:0 4px 18px #1d282b22}
#hint{position:absolute;left:12px;bottom:10px;transition:opacity .6s;padding:7px 11px;border-radius:10px;background:#ffffffe6;border:1px solid var(--line);font-size:13.5px;color:var(--muted);pointer-events:none;max-width:calc(100% - 24px)}

/* opzioni a destra */
#side{grid-row:2/4;grid-column:3;background:var(--chrome);border-left:1px solid var(--line);overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
#side .ttl{font-weight:700;text-align:center;font-size:15px;padding:2px 0 6px;border-bottom:1px solid var(--line)}
.fld{display:flex;flex-direction:column;gap:3px}
.fld .k{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.step{display:grid;grid-template-columns:44px 1fr 44px;gap:4px;align-items:center}
.step button{min-height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:22px;font-weight:700;cursor:pointer;touch-action:manipulation}
.step .v{text-align:center;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.tog{min-height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:600;cursor:pointer;text-align:left;padding:0 10px;display:flex;align-items:center;gap:8px;touch-action:manipulation}
.tog::before{content:'';width:18px;height:18px;border-radius:5px;border:2px solid var(--line);flex:none;box-sizing:border-box}
.tog.on::before{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 2px #fff}
.sp{border-top:1px solid var(--line);margin:4px 0}
.grpl{display:flex;flex-direction:column;gap:4px}
.gi{min-height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:600;cursor:pointer;text-align:left;padding:0 10px;touch-action:manipulation;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gi.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.mini{min-height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:600;cursor:pointer;touch-action:manipulation;font-size:13.5px}
.mini.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mini[disabled]{opacity:.4;cursor:default}
.sec-h{font-weight:700;font-size:14px;color:var(--accent);margin-top:2px}
.addbox{display:flex;flex-direction:column;gap:6px;padding:6px;min-width:0;border:2px solid var(--accent);border-radius:12px;background:#fff}
.addgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.addgrid button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:62px;min-width:0;padding:4px 2px;overflow-wrap:anywhere;hyphens:auto;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:12px;font-weight:600;line-height:1.1;cursor:pointer;touch-action:manipulation}
.addgrid svg{width:28px;height:28px}

/* barra in basso: apertura dei piani */
#bottom{grid-row:3;grid-column:2;display:flex;align-items:center;gap:12px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--chrome);border-top:1px solid var(--line);flex-wrap:wrap}
#bottom .k{font-weight:700;white-space:nowrap}
#open{flex:1 1 220px;min-width:160px;height:40px;accent-color:var(--accent);touch-action:none}
#openV{font-weight:700;font-variant-numeric:tabular-nums;min-width:40px}

/* pannello Esercizi */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--chrome);border-left:1px solid var(--line);box-shadow:-8px 0 30px #1d282b33;z-index:20;display:flex;flex-direction:column}
#drawer header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line)}
#drawer header b{font-size:19px}
#dBody{overflow-y:auto;padding:12px 14px 30px;display:flex;flex-direction:column;gap:16px;-webkit-user-select:text;user-select:text}
#dBody .k{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px;display:block}
#dBody .wrap{display:flex;flex-wrap:wrap;gap:6px}
#dBody .empty{color:var(--muted);font-size:13.5px}
#dBody .list{display:flex;flex-direction:column;gap:6px;margin-top:6px}
#dBody .item{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 6px 6px 10px}
#dBody .item .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis}
#dBody .item .dt{font-weight:400;font-size:12.5px;color:var(--muted)}
#dBody input[type=text]{flex:1;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font:inherit;font-weight:600}
#dBody details{background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 12px}
#dBody summary{cursor:pointer;padding:12px 2px;font-weight:700}
#dBody details .wrap{margin-bottom:10px}
#backdrop{position:fixed;inset:0;background:#1d282b33;z-index:19}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1c2126;color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;z-index:30;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}#toast.warn{background:#8a3b0d}
@media (max-width:1100px){#app{grid-template-columns:84px 1fr 170px}.sol{font-size:11px}.sol svg{width:26px;height:26px}.brand b{display:none}}
</style>
</head><body>
<div id="app">
  <header id="top">
    <div class="brand"><svg class="logo" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 26a13 13 0 0 1 22 0" stroke-width="1.6" stroke-dasharray="2.5 2.5"/><path d="M16 4v3M16 7 9 26M16 7l7 19"/><circle cx="16" cy="8" r="2.2" fill="currentColor"/></svg><b>Tavola viva</b><span>· Proiezioni ortogonali</span></div>
    <span class="test">In prova · non definitiva</span>
    <div class="spacer"></div>
    <button class="btn" id="saveBtn" title="Salva l’esercizio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>Salva</button>
    <button class="btn" id="exBtn" title="Esercizi salvati, Google Drive, PDF del foglio, Porta in Tavola viva"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 6h6l2 2h8v11H4z"/></svg>Esercizi</button>
    <button class="btn" id="view3d" title="Torna alla vista del triedro in prospettiva">Vista 3D</button>
    <button class="btn" id="viewFront" title="Guarda il triedro di fronte: con i piani aperti è il disegno sul foglio">Vista di fronte</button>
    <a class="btn" href="index.html" title="Torna alla tavola"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>Tavola</a>
    <button class="btn" id="fsBtn" title="Schermo intero"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </header>

  <nav id="solids" aria-label="Solidi">
    <div class="h">Tipo di solido</div>
    <button class="sol" data-s="parallelepipedo"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M5 11l7-5h15l-7 5zM5 11v15h15V11M20 26l7-5V6"/></svg>Parallele&shy;pipedo</button>
    <button class="sol" data-s="cubo"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M6 11l6-5h14l-6 5zM6 11v15h14V11M20 26l6-5V6"/></svg>Cubo</button>
    <button class="sol" data-s="prisma3"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M6 26h14l6-5M6 26l7-6 13 1M6 26V10l7-5v15M20 26V10L6 10M13 5l13 1v15M20 10l6-4"/></svg>Prisma triangolare</button>
    <button class="sol" data-s="prisma6"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M9 8h14l4 4-4 4H9l-4-4zM5 12v13l4 4h14l4-4V12M9 16v13M23 16v13"/></svg>Prisma esagonale</button>
    <button class="sol" data-s="piramide"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M16 4 4 24l9 4 15-4zM16 4l-3 24M16 4l12 20"/></svg>Piramide</button>
    <button class="sol" data-s="cilindro"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7"><ellipse cx="16" cy="8" rx="10" ry="4"/><path d="M6 8v16c0 2.2 4.5 4 10 4s10-1.8 10-4V8"/></svg>Cilindro</button>
    <button class="sol" data-s="cono"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M16 4 6 24M16 4l10 20"/><ellipse cx="16" cy="24" rx="10" ry="4"/></svg>Cono</button>
  </nav>

  <main id="stage">
    <canvas id="cv" aria-label="Triedro di Monge con il solido e le sue proiezioni"></canvas>
    <div id="beta" role="status"><span>⚠ <b>Sezione in prova</b>: le proiezioni non sono ancora definitive e possono cambiare.</span><button id="betaOk">Ho capito</button></div>
    <div id="legend" hidden aria-live="polite"></div>

  </main>

  <aside id="side" aria-label="Misure e opzioni"></aside>

  <div id="backdrop" hidden></div>
  <aside id="drawer" hidden aria-label="Esercizi"><header><b>Esercizi</b><button class="btn" id="dClose">Chiudi</button></header><div id="dBody"></div></aside>

  </div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const DEG = Math.PI / 180, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = v => (Math.round(v * 10) / 10).toString().replace('.', ',');

/* ---------- tema, lo stesso scelto nella tavola ---------- */
const THEMES = {
  bosco: { accent: '#1f5c45', soft: '#d3ebe0', desk: '#cdd9d2', chrome: '#f5f8f6', chrome2: '#e6eee9', line: '#cbdad1' },
  petrolio: { accent: '#0a6873', soft: '#d6ecee', desk: '#c9d3d1', chrome: '#f5f7f6', chrome2: '#e9eeed', line: '#ccd7d5' },
  lavanda: { accent: '#6247aa', soft: '#e8e2f6', desk: '#d6d1e4', chrome: '#f8f6fc', chrome2: '#edeaf6', line: '#d9d2e8' }
};
let TH = THEMES.bosco;
try { TH = THEMES[JSON.parse(localStorage.getItem('tavolaviva.tema'))] || TH; } catch (_) { }
for (const [v, k] of [['--accent', 'accent'], ['--accent-soft', 'soft'], ['--desk', 'desk'], ['--chrome', 'chrome'], ['--chrome-2', 'chrome2'], ['--line', 'line']]) document.documentElement.style.setProperty(v, TH[k]);
document.querySelector('meta[name="theme-color"]').content = TH.accent;
const SEC = '#d9480f'; // colore della sezione e del piano secante

/* ---------- stato ----------
   Coordinate del triedro (cm): x lungo la linea di terra (i solidi stanno a x < 0, PL è il piano x = 0),
   y = distanza da PV (verso chi guarda), z = altezza sopra PO.
   Metodo europeo: PO si ribalta in basso ruotando attorno alla linea di terra, PL si ribalta a destra. */
const KINDS = {
  parallelepipedo: { n: 'Parallelepipedo', dims: [['a', 'Larghezza', 6], ['b', 'Profondità', 3], ['h', 'Altezza', 4]] },
  cubo: { n: 'Cubo', dims: [['l', 'Spigolo', 4]] },
  prisma3: { n: 'Prisma triangolare', dims: [['l', 'Lato di base', 5], ['h', 'Altezza', 6]] },
  prisma6: { n: 'Prisma esagonale', dims: [['l', 'Lato di base', 2.5], ['h', 'Altezza', 6]] },
  piramide: { n: 'Piramide quadrata', dims: [['l', 'Lato di base', 5], ['h', 'Altezza', 6]] },
  cilindro: { n: 'Cilindro', dims: [['d', 'Diametro', 4], ['h', 'Altezza', 6]] },
  cono: { n: 'Cono', dims: [['d', 'Diametro', 5], ['h', 'Altezza', 6]] }
};
const defDims = k => Object.fromEntries(KINDS[k].dims.map(d => [d[0], d[2]]));
const newSolid = (kind, o) => Object.assign({ kind, dims: { [kind]: defDims(kind) }, dPV: 2, dPL: 2, z0: 0, rot: 0 }, o || {});
const S = { name: 'Esercizio senza nome', legend: false, solids: [newSolid('parallelepipedo')], act: 0, open: 0, rays: true, hidden: true, solid: true, labels: true, recall: true, sheet: true,
  sec: { on: false, type: 'oriz', pos: 3, ang: 30, cut: true } };
try {
  const o = JSON.parse(localStorage.getItem('tavolaviva.proiezioni')) || {};
  if (o.solids) Object.assign(S, o); // versione attuale
  else if (o.kind) S.solids = [newSolid(o.kind, { dims: { [o.kind]: (o.dim || {})[o.kind] || defDims(o.kind) }, dPV: o.dPV ?? 2, dPL: o.dPL ?? 2, rot: o.rot || 0 })]; // versione precedente con un solo solido
  for (const k of ['rays', 'hidden', 'solid', 'labels', 'recall', 'legend']) if (k in o) S[k] = o[k];
} catch (_) { }
S.open = 0; S.act = clamp(S.act || 0, 0, S.solids.length - 1);
const saveS = () => { try { const { open, ...keep } = S; localStorage.setItem('tavolaviva.proiezioni', JSON.stringify(keep)); } catch (_) { } };
const dimsOf = sd => sd.dims[sd.kind] || (sd.dims[sd.kind] = defDims(sd.kind));

/* ---------- geometria dei solidi ---------- */
const dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const sub3 = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
function norm(a) { const l = Math.hypot(...a) || 1; return a.map(v => v / l); }
function regular(n, R, a0) { return Array.from({ length: n }, (_, i) => [R * Math.cos(a0 + i * 2 * Math.PI / n), R * Math.sin(a0 + i * 2 * Math.PI / n)]); }
function prismOf(base, h) {
  const n = base.length, V = [], F = [];
  base.forEach(([x, y]) => V.push([x, y, 0])); base.forEach(([x, y]) => V.push([x, y, h]));
  F.push({ v: [...Array(n).keys()].reverse() }); F.push({ v: [...Array(n).keys()].map(i => i + n) });
  for (let i = 0; i < n; i++) { const j = (i + 1) % n; F.push({ v: [i, j, j + n, i + n], lat: true }); }
  return { V, F };
}
function pyramidOf(base, h) {
  const n = base.length, V = base.map(([x, y]) => [x, y, 0]); V.push([0, 0, h]);
  const F = [{ v: [...Array(n).keys()].reverse() }];
  for (let i = 0; i < n; i++) F.push({ v: [i, (i + 1) % n, n], lat: true });
  return { V, F };
}

// Google Drive: nel Drive di chi salva, cartella «Tavola viva» → «Proiezioni»; permesso drive.file (solo i file creati dall'app)
const GDRIVE_CLIENT_ID = '70316158627-hhilqjep07l70gf2i4vn1tap501tktnf.apps.googleusercontent.com';
const GAPI = 'https://www.googleapis.com/drive/v3', GUP = 'https://www.googleapis.com/upload/drive/v3';
let DRIVEF = null, DRIVE_LIST = null, gTok = null, gTokExp = 0, gClient = null, gWaiting = null, gFolder = null;
function gisLoad() {
  if (window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
  return gisLoad.p || (gisLoad.p = new Promise((ok, ko) => { const sc = document.createElement('script'); sc.src = 'https://accounts.google.com/gsi/client'; sc.async = true; sc.onload = ok; sc.onerror = () => { gisLoad.p = null; ko(new Error('rete')); }; document.head.appendChild(sc); }));
}
function gToken() {
  if (gTok && Date.now() < gTokExp - 60000) return Promise.resolve(gTok);
  if (!(window.google && google.accounts && google.accounts.oauth2)) return Promise.reject(new Error('rete'));
  if (!gClient) gClient = google.accounts.oauth2.initTokenClient({ client_id: GDRIVE_CLIENT_ID, scope: 'https://www.googleapis.com/auth/drive.file',
    callback: r => { const w = gWaiting; gWaiting = null; if (!w) return; if (r && r.access_token) { gTok = r.access_token; gTokExp = Date.now() + (r.expires_in || 3600) * 1000; w.ok(gTok); } else w.ko(new Error(r && r.error || 'permesso')); },
    error_callback: e => { const w = gWaiting; gWaiting = null; if (w) w.ko(new Error(e && e.type || 'annullato')); } });
  return new Promise((ok, ko) => { gWaiting = { ok, ko }; gClient.requestAccessToken({ prompt: gTok ? '' : undefined }); });
}
async function gFetch(url, opt) {
  const t = await gToken(), r = await fetch(url, Object.assign({}, opt, { headers: Object.assign({ Authorization: 'Bearer ' + t }, (opt && opt.headers) || {}) }));
  if (r.status === 401) { gTok = null; throw new Error('scaduto'); }
  if (!r.ok) throw new Error('drive ' + r.status);
  return r;
}
async function gDir(name, parent) {
  const q = encodeURIComponent(`mimeType='application/vnd.google-apps.folder' and name='${name}' and trashed=false` + (parent ? ` and '${parent}' in parents` : ''));
  const l = await (await gFetch(`${GAPI}/files?q=${q}&fields=files(id)&spaces=drive`)).json();
  if (l.files && l.files.length) return l.files[0].id;
  const meta = { name, mimeType: 'application/vnd.google-apps.folder' }; if (parent) meta.parents = [parent];
  return (await (await gFetch(`${GAPI}/files?fields=id`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(meta) })).json()).id;
}
const gFolderId = async () => gFolder || (gFolder = await gDir('Proiezioni', await gDir('Tavola viva')));
const driveErr = e => toast(/rete/.test(e.message) ? 'Google Drive non raggiungibile: controlla la connessione.' : /annullato|popup|permesso|access_denied/.test(e.message) ? 'Accesso a Google Drive annullato.' : 'Google Drive non ha risposto: riprova, oppure scarica il PDF.', 'warn');
async function driveSave(quiet) {
  const tokP = gToken(); // subito, finché vale il tocco sul pulsante
  try {
    await tokP; const pdf = await exPDF(), name = safeName(S.name) + '.pdf';
    if (DRIVEF) {
      await gFetch(`${GUP}/files/${DRIVEF.id}?uploadType=media`, { method: 'PATCH', headers: { 'Content-Type': 'application/pdf' }, body: pdf });
      if (DRIVEF.name !== name) { await gFetch(`${GAPI}/files/${DRIVEF.id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) }); DRIVEF.name = name; }
    } else {
      const meta = { name, mimeType: 'application/pdf', parents: [await gFolderId()] }, b = 'proiezioni' + Date.now();
      const body = new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: application/pdf\r\n\r\n`, pdf, `\r\n--${b}--`]);
      const f = await (await gFetch(`${GUP}/files?uploadType=multipart&fields=id,name`, { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + b }, body })).json();
      DRIVEF = { id: f.id, name: f.name };
    }
    if (!$('#drawer').hidden) renderEx();
    toast(quiet ? 'Esercizio “' + S.name + '” salvato, anche su Drive' : 'Salvato su Drive, in Tavola viva → Proiezioni: d’ora in poi Salva aggiorna anche Drive.');
  } catch (e) { driveErr(e); }
}
async function driveList() {
  const tokP = gToken();
  try { await tokP; const fid = await gFolderId(), q = encodeURIComponent(`'${fid}' in parents and trashed=false`);
    DRIVE_LIST = (await (await gFetch(`${GAPI}/files?q=${q}&orderBy=modifiedTime desc&pageSize=100&fields=files(id,name,modifiedTime)`)).json()).files || []; renderEx();
  } catch (e) { driveErr(e); }
}
async function driveOpen(id) {
  try { const buf = await (await gFetch(`${GAPI}/files/${id}?alt=media`)).arrayBuffer(), f = (DRIVE_LIST || []).find(d => d.id === id);
    if (await openBuf(buf)) { if (f) DRIVEF = { id, name: f.name }; closeEx(); toast('Aperto “' + S.name + '” da Drive: Salva aggiornerà il file su Drive'); }
  } catch (e) { driveErr(e); }
}

// Porta in Tavola viva: le tre viste diventano segni veri su un foglio di Tavola viva
function toTavola() {
  if (!CUT.length) { toast('Non ci sono solidi da portare sul foglio.', 'warn'); return; }
  if (S.name === NONAME) S.name = autoName();
  const sp = sheetPrims(), { W, H, M } = sp, X = u => Math.round((u + W + M) * 1000) / 1000, Y = v => Math.round((H + M - v) * 1000) / 1000, st = [];
  const PEN = { vis: ['HB', false], hid: ['2H', true], thin: ['2H', false], lt: ['2H', false], axis: ['2H', true], trace: ['2H', true], hatch: ['2H', false] };
  for (const o of sp.items) {
    if (o.t === 'line') { const [pen, dash] = PEN[o.st]; st.push({ type: 'line', x1: X(o.a[0]), y1: Y(o.a[1]), x2: X(o.b[0]), y2: Y(o.b[1]), pen, dash }); }
    else if (o.t === 'arc') st.push({ type: 'arc', cx: X(0), cy: Y(0), r: Math.round(o.r * 1000) / 1000, a0: 0, sw: Math.PI / 2, pen: '2H', dash: false });
    else if (o.t === 'text') st.push({ type: 'label', x: X(o.p[0]), y: Y(o.p[1]), text: o.text });
  }
  try { localStorage.setItem('tavolaviva.importa', JSON.stringify({ name: S.name, sheet: { w: 2 * (W + M), h: 2 * (H + M), margin: M }, strokes: st })); }
  catch (_) { toast('Non sono riuscita a preparare il foglio.', 'warn'); return; }
  saveS(); location.href = 'index.html#importa';
}

// il pannello
function renderEx() {
  const L = exList(), names = Object.keys(L).sort((a, b) => L[b].savedAt - L[a].savedAt), when = t => new Date(t || 0).toLocaleString('it-IT', { dateStyle: 'short', timeStyle: 'short' });
  const item = (nm, dt, btns) => `<div class="item"><span class="nm">${esc(nm)}<br><span class="dt">${dt}</span></span>${btns}</div>`;
  $('#dBody').innerHTML = `<div><span class="k">Esercizio aperto</span><div class="wrap"><input type="text" id="exName" value="${esc(S.name === NONAME ? '' : S.name)}" placeholder="${esc(autoName())}" aria-label="Nome dell’esercizio"><button class="btn primary" data-x="save">Salva</button></div>
      <div class="wrap" style="margin-top:6px"><button class="btn" data-x="new">Nuovo esercizio</button></div>${DRIVEF ? '<div class="empty" style="margin-top:6px">Salva aggiorna anche il file su Drive.</div>' : ''}</div>
    <div><span class="k">Google Drive</span><div class="wrap"><button class="btn primary" data-x="dsave">Salva su Drive</button><button class="btn" data-x="dopen">Apri da Drive</button></div>
      ${DRIVE_LIST ? `<div class="list">${DRIVE_LIST.length ? DRIVE_LIST.map(d => item(d.name.replace(/\.pdf$/i, ''), when(d.modifiedTime), `<button class="btn" data-x="dget" data-v="${esc(d.id)}">Apri</button>`)).join('') : '<div class="empty">Ancora nessun esercizio su Drive.</div>'}</div>` : ''}</div>
    <div><span class="k">Il foglio con le tre viste</span><div class="wrap"><button class="btn primary" data-x="pdf">Foglio in PDF</button><button class="btn primary" data-x="tav">Porta in Tavola viva</button></div></div>
    <div><span class="k">Salvati in questo browser</span><div class="list">${names.length ? names.map(n => item(n, when(L[n].savedAt), `<button class="btn" data-x="open" data-v="${esc(n)}">Apri</button><button class="btn" data-x="del" data-v="${esc(n)}">Elimina</button>`)).join('') : '<div class="empty">Nessun esercizio salvato.</div>'}</div></div>
    <details><summary>Altre opzioni</summary><div class="wrap"><button class="btn" data-x="file">Riapri un PDF salvato…</button></div></details>`;
}
function openEx() { gisLoad().catch(() => { }); renderEx(); $('#drawer').hidden = $('#backdrop').hidden = false; }
function closeEx() { $('#drawer').hidden = $('#backdrop').hidden = true; }
$('#legBtn').onclick = () => { S.legend = !S.legend; saveS(); renderLegend(); };
$('#exBtn').onclick = openEx; $('#dClose').onclick = closeEx; $('#backdrop').onclick = closeEx;
$('#saveBtn').onclick = () => { gisLoad().catch(() => { }); exSave(); };
$('#dBody').addEventListener('input', e => { if (e.target.id === 'exName') { S.name = e.target.value.trim() || NONAME; saveS(); } });
$('#dBody').addEventListener('click', e => {
  const b = e.target.closest('[data-x]'); if (!b) return; const x = b.dataset.x, v = b.dataset.v;
  if (x === 'save') exSave();
  else if (x === 'new') { newExercise(); renderEx(); }
  else if (x === 'dsave') { if (S.name === NONAME) S.name = autoName(); driveSave(); }
  else if (x === 'dopen') driveList();
  else if (x === 'dget') driveOpen(v);
  else if (x === 'pdf') exPDF(80).then(p => downloadBlob(p, safeName(S.name) + '.pdf'));
  else if (x === 'tav') toTavola();
  else if (x === 'open') { const L = exList(); if (L[v]) { exArchive(); loadExercise(Object.assign({}, L[v].s, { name: v })); closeEx(); toast('Aperto “' + v + '”'); } }
  else if (x === 'del') { if (confirm('Eliminare “' + v + '” da questo browser?')) { const L = exList(); delete L[v]; localStorage.setItem(LSX, JSON.stringify(L)); renderEx(); } }
  else if (x === 'file') $('#fileIn').click();
});
// esercizio arrivato dal pulsante «Apri nelle Proiezioni» di un PDF
if (location.hash.startsWith('#esercizio=')) { const b64 = location.hash.slice(11); history.replaceState(null, '', location.pathname + location.search);
  unpackData(b64).then(o => { exArchive(); if (loadExercise(o)) toast('Aperto “' + S.name + '”'); }, () => toast('Non sono riuscita ad aprire l’esercizio.', 'warn')); }
setTimeout(() => { $('#hint').style.opacity = 0; setTimeout(() => $('#hint').hidden = true, 700); }, 7000);
window.PR = { exPrims: () => sheetPrims(), loadExercise, S, CAM, setOpen, changed, get CUT() { return CUT; }, get MESH() { return MESH; }, edgesSeen, VIEWS, seen: n => seen(n), proj, get DRAG() { return DRAG; } };
})();
</script>
