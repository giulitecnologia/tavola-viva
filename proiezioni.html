<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tavola viva · Proiezioni</title>
<meta name="theme-color" content="#1f5c45">
<link rel="icon" type="image/png" sizes="32x32" href="icone/favicon-32.png">
<style>
/* Proiezioni ortogonali nel triedro di Monge: il solido nel triedro, le proiezioni sui tre piani e l'apertura dei piani fino al disegno 2D */
:root{
  --desk:#cdd9d2;--chrome:#f5f8f6;--chrome-2:#e6eee9;--ink:#1d282b;--muted:#5b6b6f;--line:#cbdad1;
  --accent:#1f5c45;--accent-soft:#d3ebe0;
  --f-ui:"Avenir Next","Segoe UI","Helvetica Neue",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--ink);font-family:var(--f-ui);font-size:15px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#app{position:fixed;inset:0;display:grid;grid-template-columns:104px 1fr 190px;grid-template-rows:auto 1fr auto;background:var(--desk)}
#top{grid-column:1/4;display:flex;align-items:center;gap:10px;padding:7px 12px;padding-top:calc(7px + env(safe-area-inset-top,0px));background:var(--chrome);border-bottom:3px solid var(--accent);min-width:0;overflow-x:auto;scrollbar-width:none}
#top::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap}
.brand b{font-size:17px}.brand span{font-weight:600;color:var(--accent)}
.brand .logo{width:28px;height:28px;color:var(--accent);flex:none}
.spacer{flex:1 1 0;min-width:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;min-width:46px;padding:0 12px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:14.5px;touch-action:manipulation;text-decoration:none;color:inherit;box-sizing:border-box}
.btn:active{transform:translateY(1px)}
.btn.on,.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn svg{width:22px;height:22px;flex:none}
.btn:focus-visible,.sol:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.test{font-size:12.5px;font-weight:700;color:#a6501a;background:#fbe9dc;border:1px solid #ecc9ae;border-radius:8px;padding:4px 8px;white-space:nowrap}

/* solidi a sinistra */
#solids{grid-row:2/4;background:var(--chrome);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:3px;padding:8px 6px;overflow-y:auto}
.h{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 4px 2px;text-align:center}
.sol{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px;padding:5px 2px;border:1px solid transparent;border-radius:10px;background:transparent;cursor:pointer;font-size:12px;font-weight:600;line-height:1.15;text-align:center;touch-action:manipulation;flex:none}
.sol svg{width:30px;height:30px}
.sol.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* area 3D */
#stage{grid-row:2;grid-column:2;position:relative;overflow:hidden;min-width:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:grab}
#hint{position:absolute;left:12px;bottom:10px;transition:opacity .6s;padding:7px 11px;border-radius:10px;background:#ffffffe6;border:1px solid var(--line);font-size:13.5px;color:var(--muted);pointer-events:none;max-width:calc(100% - 24px)}

/* opzioni a destra */
#side{grid-row:2/4;grid-column:3;background:var(--chrome);border-left:1px solid var(--line);overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
#side .ttl{font-weight:700;text-align:center;font-size:15px;padding:2px 0 6px;border-bottom:1px solid var(--line)}
.fld{display:flex;flex-direction:column;gap:3px}
.fld .k{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.step{display:grid;grid-template-columns:44px 1fr 44px;gap:4px;align-items:center}
.step button{min-height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:22px;font-weight:700;cursor:pointer;touch-action:manipulation}
.step .v{text-align:center;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.tog{min-height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:600;cursor:pointer;text-align:left;padding:0 10px;display:flex;align-items:center;gap:8px;touch-action:manipulation}
.tog::before{content:'';width:18px;height:18px;border-radius:5px;border:2px solid var(--line);flex:none;box-sizing:border-box}
.tog.on::before{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 2px #fff}
.sp{border-top:1px solid var(--line);margin:4px 0}
.grpl{display:flex;flex-direction:column;gap:4px}
.gi{min-height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:600;cursor:pointer;text-align:left;padding:0 10px;touch-action:manipulation;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gi.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.mini{min-height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:600;cursor:pointer;touch-action:manipulation;font-size:13.5px}
.mini.on{background:var(--accent);border-color:var(--accent);color:#fff}
.mini[disabled]{opacity:.4;cursor:default}
.sec-h{font-weight:700;font-size:14px;color:var(--accent);margin-top:2px}

/* barra in basso: apertura dei piani */
#bottom{grid-row:3;grid-column:2;display:flex;align-items:center;gap:12px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--chrome);border-top:1px solid var(--line);flex-wrap:wrap}
#bottom .k{font-weight:700;white-space:nowrap}
#open{flex:1 1 220px;min-width:160px;height:40px;accent-color:var(--accent);touch-action:none}
#openV{font-weight:700;font-variant-numeric:tabular-nums;min-width:40px}

@media (max-width:1100px){#app{grid-template-columns:84px 1fr 170px}.sol{font-size:11px}.sol svg{width:26px;height:26px}.brand b{display:none}}
</style>
</head><body>
<div id="app">
  <header id="top">
    <div class="brand"><svg class="logo" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 26a13 13 0 0 1 22 0" stroke-width="1.6" stroke-dasharray="2.5 2.5"/><path d="M16 4v3M16 7 9 26M16 7l7 19"/><circle cx="16" cy="8" r="2.2" fill="currentColor"/></svg><b>Tavola viva</b><span>· Proiezioni ortogonali</span></div>
    <span class="test">Versione di prova</span>
    <div class="spacer"></div>
    <button class="btn" id="view3d" title="Torna alla vista del triedro in prospettiva">Vista 3D</button>
    <button class="btn" id="viewFront" title="Guarda il triedro di fronte: con i piani aperti è il disegno sul foglio">Vista di fronte</button>
    <a class="btn" href="./" title="Torna alla tavola"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>Tavola</a>
    <button class="btn" id="fsBtn" title="Schermo intero"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </header>

  <nav id="solids" aria-label="Solidi">
    <div class="h">Tipo di solido</div>
    <button class="sol" data-s="parallelepipedo"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M5 11l7-5h15l-7 5zM5 11v15h15V11M20 26l7-5V6"/></svg>Parallele&shy;pipedo</button>
    <button class="sol" data-s="cubo"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M6 11l6-5h14l-6 5zM6 11v15h14V11M20 26l6-5V6"/></svg>Cubo</button>
    <button class="sol" data-s="prisma3"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M6 26h14l6-5M6 26l7-6 13 1M6 26V10l7-5v15M20 26V10L6 10M13 5l13 1v15M20 10l6-4"/></svg>Prisma triangolare</button>
    <button class="sol" data-s="prisma6"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M9 8h14l4 4-4 4H9l-4-4zM5 12v13l4 4h14l4-4V12M9 16v13M23 16v13"/></svg>Prisma esagonale</button>
    <button class="sol" data-s="piramide"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M16 4 4 24l9 4 15-4zM16 4l-3 24M16 4l12 20"/></svg>Piramide</button>
    <button class="sol" data-s="cilindro"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7"><ellipse cx="16" cy="8" rx="10" ry="4"/><path d="M6 8v16c0 2.2 4.5 4 10 4s10-1.8 10-4V8"/></svg>Cilindro</button>
    <button class="sol" data-s="cono"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M16 4 6 24M16 4l10 20"/><ellipse cx="16" cy="24" rx="10" ry="4"/></svg>Cono</button>
  </nav>

  <main id="stage">
    <canvas id="cv" aria-label="Triedro di Monge con il solido e le sue proiezioni"></canvas>
    <div id="hint">Trascina per girare il triedro · due dita per ingrandire e spostare</div>
  </main>

  <aside id="side" aria-label="Misure e opzioni"></aside>

  <div id="bottom">
    <button class="btn primary" id="playBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><span id="playLbl">Apri i piani</span></button>
    <span class="k">Apertura</span>
    <input type="range" id="open" min="0" max="90" step="1" value="0" aria-label="Apertura dei piani in gradi">
    <span id="openV">0°</span>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const DEG = Math.PI / 180, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = v => (Math.round(v * 10) / 10).toString().replace('.', ',');

/* ---------- tema, lo stesso scelto nella tavola ---------- */
const THEMES = {
  bosco: { accent: '#1f5c45', soft: '#d3ebe0', desk: '#cdd9d2', chrome: '#f5f8f6', chrome2: '#e6eee9', line: '#cbdad1' },
  petrolio: { accent: '#0a6873', soft: '#d6ecee', desk: '#c9d3d1', chrome: '#f5f7f6', chrome2: '#e9eeed', line: '#ccd7d5' },
  lavanda: { accent: '#6247aa', soft: '#e8e2f6', desk: '#d6d1e4', chrome: '#f8f6fc', chrome2: '#edeaf6', line: '#d9d2e8' }
};
let TH = THEMES.bosco;
try { TH = THEMES[JSON.parse(localStorage.getItem('tavolaviva.tema'))] || TH; } catch (_) { }
for (const [v, k] of [['--accent', 'accent'], ['--accent-soft', 'soft'], ['--desk', 'desk'], ['--chrome', 'chrome'], ['--chrome-2', 'chrome2'], ['--line', 'line']]) document.documentElement.style.setProperty(v, TH[k]);
document.querySelector('meta[name="theme-color"]').content = TH.accent;
const SEC = '#d9480f'; // colore della sezione e del piano secante

/* ---------- stato ----------
   Coordinate del triedro (cm): x lungo la linea di terra (i solidi stanno a x < 0, PL è il piano x = 0),
   y = distanza da PV (verso chi guarda), z = altezza sopra PO.
   Metodo europeo: PO si ribalta in basso ruotando attorno alla linea di terra, PL si ribalta a destra. */
const KINDS = {
  parallelepipedo: { n: 'Parallelepipedo', dims: [['a', 'Larghezza', 6], ['b', 'Profondità', 3], ['h', 'Altezza', 4]] },
  cubo: { n: 'Cubo', dims: [['l', 'Spigolo', 4]] },
  prisma3: { n: 'Prisma triangolare', dims: [['l', 'Lato di base', 5], ['h', 'Altezza', 6]] },
  prisma6: { n: 'Prisma esagonale', dims: [['l', 'Lato di base', 2.5], ['h', 'Altezza', 6]] },
  piramide: { n: 'Piramide quadrata', dims: [['l', 'Lato di base', 5], ['h', 'Altezza', 6]] },
  cilindro: { n: 'Cilindro', dims: [['d', 'Diametro', 4], ['h', 'Altezza', 6]] },
  cono: { n: 'Cono', dims: [['d', 'Diametro', 5], ['h', 'Altezza', 6]] }
};
const defDims = k => Object.fromEntries(KINDS[k].dims.map(d => [d[0], d[2]]));
const newSolid = (kind, o) => Object.assign({ kind, dims: { [kind]: defDims(kind) }, dPV: 2, dPL: 2, z0: 0, rot: 0 }, o || {});
const S = { solids: [newSolid('parallelepipedo')], act: 0, open: 0, rays: true, hidden: true, solid: true, labels: true, recall: true, sheet: true,
  sec: { on: false, type: 'oriz', pos: 3, ang: 30, cut: true } };
try {
  const o = JSON.parse(localStorage.getItem('tavolaviva.proiezioni')) || {};
  if (o.solids) Object.assign(S, o); // versione attuale
  else if (o.kind) S.solids = [newSolid(o.kind, { dims: { [o.kind]: (o.dim || {})[o.kind] || defDims(o.kind) }, dPV: o.dPV ?? 2, dPL: o.dPL ?? 2, rot: o.rot || 0 })]; // versione precedente con un solo solido
  for (const k of ['rays', 'hidden', 'solid', 'labels', 'recall']) if (k in o) S[k] = o[k];
} catch (_) { }
S.open = 0; S.act = clamp(S.act || 0, 0, S.solids.length - 1);
const saveS = () => { try { const { open, ...keep } = S; localStorage.setItem('tavolaviva.proiezioni', JSON.stringify(keep)); } catch (_) { } };
const dimsOf = sd => sd.dims[sd.kind] || (sd.dims[sd.kind] = defDims(sd.kind));

/* ---------- geometria dei solidi ---------- */
const dot3 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const sub3 = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
function norm(a) { const l = Math.hypot(...a) || 1; return a.map(v => v / l); }
function regular(n, R, a0) { return Array.from({ length: n }, (_, i) => [R * Math.cos(a0 + i * 2 * Math.PI / n), R * Math.sin(a0 + i * 2 * Math.PI / n)]); }
function prismOf(base, h) {
  const n = base.length, V = [], F = [];
  base.forEach(([x, y]) => V.push([x, y, 0])); base.forEach(([x, y]) => V.push([x, y, h]));
  F.push({ v: [...Array(n).keys()].reverse() }); F.push({ v: [...Array(n).keys()].map(i => i + n) });
  for (let i = 0; i < n; i++) { const j = (i + 1) % n; F.push({ v: [i, j, j + n, i + n], lat: true }); }
  return { V, F };
}
function pyramidOf(base, h) {
  const n = base.length, V = base.map(([x, y]) => [x, y, 0]); V.push([0, 0, h]);
  const F = [{ v: [...Array(n).keys()].reverse() }];
  for (let i = 0; i < n; i++) F.push({ v: [i, (i + 1) % n, n], lat: true });
  return { V, F };
}
// completa un solido: normali (metodo di Newell) e spigoli con le facce adiacenti
function finish(m) {
  for (const f of m.F) { let nx = 0, ny = 0, nz = 0; const P = f.v.map(i => m.V[i]); for (let i = 0; i < P.length; i++) { const a = P[i], b = P[(i + 1) % P.length]; nx += (a[1] - b[1]) * (a[2] + b[2]); ny += (a[2] - b[2]) * (a[0] + b[0]); nz += (a[0] - b[0]) * (a[1] + b[1]); } const l = Math.hypot(nx, ny, nz) || 1; f.n = [nx / l, ny / l, nz / l]; f.q = P[0]; }
  const E = new Map();
  m.F.forEach((f, fi) => f.v.forEach((a, i) => { const b = f.v[(i + 1) % f.v.length]; if (a === b) return; const k = a < b ? a + '-' + b : b + '-' + a; if (!E.has(k)) E.set(k, { a: Math.min(a, b), b: Math.max(a, b), f: [] }); E.get(k).f.push(fi); }));
  m.E = [...E.values()].map(e => Object.assign(e, { smooth: m.round && e.f.length === 2 && e.f.every(fi => m.F[fi].lat) }));
  return m;
}
function buildSolid(sd) {
  const d = dimsOf(sd); let m;
  // base orientata con un lato parallelo a PV (e alla linea di terra)
  if (sd.kind === 'parallelepipedo') m = prismOf([[-d.a / 2, -d.b / 2], [d.a / 2, -d.b / 2], [d.a / 2, d.b / 2], [-d.a / 2, d.b / 2]], d.h);
  else if (sd.kind === 'cubo') m = prismOf([[-d.l / 2, -d.l / 2], [d.l / 2, -d.l / 2], [d.l / 2, d.l / 2], [-d.l / 2, d.l / 2]], d.l);
  else if (sd.kind === 'prisma3') m = prismOf(regular(3, d.l / Math.sqrt(3), Math.PI / 2), d.h);
  else if (sd.kind === 'prisma6') m = prismOf(regular(6, d.l, 0), d.h);
  else if (sd.kind === 'piramide') m = pyramidOf(regular(4, d.l / Math.SQRT2, Math.PI / 4), d.h);
  else if (sd.kind === 'cilindro') m = prismOf(regular(64, d.d / 2, 0), d.h);
  else m = pyramidOf(regular(64, d.d / 2, 0), d.h);
  m.round = sd.kind === 'cilindro' || sd.kind === 'cono'; m.sd = sd;
  // rotazione attorno all'asse verticale, poi posizione: distanze da PV e PL misurate dal punto più vicino; base all'altezza z0
  const c = Math.cos(sd.rot * DEG), s = Math.sin(sd.rot * DEG);
  m.V = m.V.map(([x, y, z]) => [x * c - y * s, x * s + y * c, z]);
  const maxX = Math.max(...m.V.map(p => p[0])), minY = Math.min(...m.V.map(p => p[1]));
  const ox = -sd.dPL - maxX, oy = sd.dPV - minY;
  m.V = m.V.map(([x, y, z]) => [x + ox, y + oy, z + sd.z0]); m.axis = [ox, oy]; m.z0 = sd.z0; m.z1 = sd.z0 + (d.h ?? d.l);
  if (m.round) { const r = d.d / 2, z0 = sd.z0, z1 = m.z1; m.key = [[ox - r, oy, z0], [ox + r, oy, z0], [ox, oy - r, z0], [ox, oy + r, z0]]; if (sd.kind === 'cilindro') m.key.push([ox - r, oy, z1], [ox + r, oy, z1], [ox, oy - r, z1], [ox, oy + r, z1]); else m.key.push([ox, oy, z1]); }
  else m.key = m.V.slice();
  return finish(m);
}

/* ---------- sezione: piano secante e taglio dei solidi ---------- */
// il piano tiene la parte con n·p ≤ d; la faccia di taglio guarda verso +n, cioè verso la parte tolta
function secPlane(meshes) {
  const sc = S.sec; if (!sc.on || !meshes.length) return null;
  const xs = meshes.flatMap(m => m.V.map(p => p[0])), xc = (Math.min(...xs) + Math.max(...xs)) / 2;
  if (sc.type === 'oriz') return { n: [0, 0, 1], d: sc.pos, name: 'orizzontale' };
  if (sc.type === 'front') return { n: [0, 1, 0], d: sc.pos, name: 'frontale' };
  if (sc.type === 'lat') return { n: [-1, 0, 0], d: sc.pos, name: 'laterale' };
  const a = sc.ang * DEG, n = [-Math.sin(a), 0, Math.cos(a)]; // perpendicolare a PV, inclinato di a rispetto a PO, alto pos sull'asse dei solidi
  return { n, d: dot3(n, [xc, 0, sc.pos]), name: 'inclinato', xc };
}
function clipMesh(m, pl, keepOut) {
  const sgn = keepOut ? -1 : 1, n = pl.n.map(v => v * sgn), d = pl.d * sgn, side = p => dot3(n, p) - d, EPS = 1e-7;
  const P = [], key = new Map(), idx = p => { const k = p.map(v => Math.round(v * 1e5)).join(','); if (!key.has(k)) { key.set(k, P.length); P.push(p); } return key.get(k); };
  const F = [], cut = [];
  for (const f of m.F) {
    const poly = f.v.map(i => m.V[i]), out = [];
    for (let i = 0; i < poly.length; i++) {
      const A = poly[i], Bp = poly[(i + 1) % poly.length], sa = side(A), sb = side(Bp);
      if (sa <= EPS) out.push(A);
      if ((sa < -EPS && sb > EPS) || (sa > EPS && sb < -EPS)) { const t = sa / (sa - sb), X = [A[0] + (Bp[0] - A[0]) * t, A[1] + (Bp[1] - A[1]) * t, A[2] + (Bp[2] - A[2]) * t]; out.push(X); }
    }
    const v = [...new Set(out.map(idx))]; for (const p of out) if (Math.abs(side(p)) <= 1e-6) cut.push(idx(p));
    if (v.length >= 3) F.push({ v, lat: f.lat });
  }
  if (!F.length) return null;
  const cv = [...new Set(cut)];

  const caps = CUT.flatMap(m => m.F.filter(f => f.cap).map(f => f.v.map(i => m.V[i]))); if (!caps.length) return;

  const polys = caps.map(c => c.map(p => [dot3(p, u), dot3(p, w)])), all = polys.flat(), xs = all.map(p => p[0]), ys = all.map(p => p[1]);
  const bw = 230, bh = 190, x0 = CW - bw - 12, y0 = 12, sc = Math.min((bw - 40) / (Math.max(...xs) - Math.min(...xs) || 1), (bh - 60) / (Math.max(...ys) - Math.min(...ys) || 1), fitS * CAM.zoom);
  const cx = (Math.max(...xs) + Math.min(...xs)) / 2, cy = (Math.max(...ys) + Math.min(...ys)) / 2, T = p => [x0 + bw / 2 + (p[0] - cx) * sc, y0 + 34 + (bh - 44) / 2 - (p[1] - cy) * sc];
  G.save(); G.fillStyle = 'rgba(255,255,255,.95)'; G.strokeStyle = rgba(SEC, .7); G.lineWidth = 1.5; G.setLineDash([]); G.beginPath(); G.roundRect ? G.roundRect(x0, y0, bw, bh, 12) : G.rect(x0, y0, bw, bh); G.fill(); G.stroke();
  G.font = `700 14px ${getComputedStyle(document.body).fontFamily}`; G.fillStyle = SEC; G.textAlign = 'center'; G.textBaseline = 'middle'; G.fillText('Vera forma della sezione', x0 + bw / 2, y0 + 18);
  for (const pg of polys) {
    const Q = pg.map(T); G.beginPath(); Q.forEach((q, i) => i ? G.lineTo(q[0], q[1]) : G.moveTo(q[0], q[1])); G.closePath(); G.fillStyle = rgba(SEC, .12); G.fill();
    G.save(); G.clip(); G.beginPath(); for (let k = x0 - bh; k < x0 + bw; k += 8) { G.moveTo(k, y0 + bh); G.lineTo(k + bh, y0); } G.lineWidth = 1.2; G.strokeStyle = rgba(SEC, .85); G.stroke(); G.restore();
    G.beginPath(); Q.forEach((q, i) => i ? G.lineTo(q[0], q[1]) : G.moveTo(q[0], q[1])); G.closePath(); G.lineWidth = 2.2; G.strokeStyle = INK; G.stroke();
  }
  G.restore();
}

/* ---------- pannello: solidi del gruppo, misure, sezione ---------- */
function renderSide() {
  const sd = S.solids[S.act], K = KINDS[sd.kind], d = dimsOf(sd), sc = S.sec;
  const stepper = (key, label, val, unit, st) => `<div class="fld"><span class="k">${label}${unit === 'cm' ? ' (cm)' : ''}</span><div class="step"><button data-k="${key}" data-d="-${st}" aria-label="Meno">−</button><span class="v">${fmt(val)}${unit === '°' ? '°' : ''}</span><button data-k="${key}" data-d="${st}" aria-label="Più">+</button></div></div>`;
  const tog = (k, l, on) => `<button class="tog ${on ?? S[k] ? 'on' : ''}" data-t="${k}">${l}</button>`;
  const posLbl = { oriz: 'Altezza del piano da PO', front: 'Distanza del piano da PV', lat: 'Distanza del piano da PL', incl: 'Altezza sull’asse' }[sc.type];
  $('#side').innerHTML = `<div class="ttl">Solidi</div>
    <div class="grpl">${S.solids.map((x, i) => `<button class="gi ${i === S.act ? 'on' : ''}" data-g="${i}">${i + 1} · ${KINDS[x.kind].n}</button>`).join('')}</div>
    <div class="row2"><button class="mini" data-a="add">+ Aggiungi</button><button class="mini" data-a="del" ${S.solids.length < 2 ? 'disabled' : ''}>Rimuovi</button></div>
    <div class="sec-h">${S.act + 1} · ${K.n}</div>
    ${K.dims.map(([k, l]) => stepper('d.' + k, l, d[k], 'cm', 0.5)).join('')}
    ${stepper('dPV', 'Distanza da PV', sd.dPV, 'cm', 0.5)}${stepper('dPL', 'Distanza da PL', sd.dPL, 'cm', 0.5)}${stepper('z0', 'Base sopra PO', sd.z0, 'cm', 0.5)}${stepper('rot', 'Rotazione', sd.rot, '°', 15)}
    <button class="mini" data-a="ontop" ${S.solids.length < 2 ? 'disabled' : ''}>Appoggia sul solido sotto</button>
    <div class="sp"></div>
    ${tog('sec', 'Sezione', sc.on)}
    ${sc.on ? `<div class="row2">${[['oriz', 'Orizzontale'], ['front', 'Frontale'], ['lat', 'Laterale'], ['incl', 'Inclinata']].map(([k, l]) => `<button class="mini ${sc.type === k ? 'on' : ''}" data-st="${k}">${l}</button>`).join('')}</div>
      ${stepper('sec.pos', posLbl, sc.pos, 'cm', 0.5)}${sc.type === 'incl' ? stepper('sec.ang', 'Inclinazione su PO', sc.ang, '°', 5) : ''}${tog('cut', 'Togli la parte tagliata', sc.cut)}` : ''}
    <div class="sp"></div>
    ${tog('rays', 'Raggi proiettanti')}${tog('hidden', 'Spigoli nascosti')}${tog('recall', 'Linee di richiamo')}${tog('sheet', 'Foglio da disegno')}${tog('solid', 'Solidi')}${tog('labels', 'Nomi dei piani')}`;
  document.querySelectorAll('.sol').forEach(b => b.classList.toggle('on', b.dataset.s === sd.kind));
}
function changed() { saveS(); rebuild(); const sz = JSON.stringify(scene()); if (sz !== lastSize) { lastSize = sz; fit(); } renderSide(); draw(); } // la vista si riadatta solo se i piani cambiano davvero
function topOfOthers(i) { // il solido più alto fra quelli sotto l'impronta del solido i
  const m = buildSolid(S.solids[i]), xs = m.V.map(p => p[0]), ys = m.V.map(p => p[1]); let top = 0;
  S.solids.forEach((o, j) => { if (j === i) return; const q = buildSolid(o), qx = q.V.map(p => p[0]), qy = q.V.map(p => p[1]); if (Math.max(...xs) > Math.min(...qx) && Math.min(...xs) < Math.max(...qx) && Math.max(...ys) > Math.min(...qy) && Math.min(...ys) < Math.max(...qy)) top = Math.max(top, q.z1); });
  return top;
}
$('#side').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  const sd = S.solids[S.act];
  if (b.dataset.g) { S.act = +b.dataset.g; saveS(); renderSide(); draw(); return; }
  if (b.dataset.st) { S.sec.type = b.dataset.st; const { W, D, H } = scene(); S.sec.pos = { oriz: Math.round(H / 2 * 2) / 2 - 1, front: Math.round((D - 3) / 2 * 2) / 2 + 1, lat: Math.round((W - 3) / 2 * 2) / 2 + 1, incl: Math.round(H / 2 * 2) / 2 - 1 }[b.dataset.st]; changed(); return; }
  if (b.dataset.a === 'add') { // nuovo solido appoggiato sopra quello scelto, centrato sul suo asse
    const m = buildSolid(sd), ns = newSolid('cilindro', { dims: { cilindro: { d: 2, h: 3 } } }), r = 1;
    ns.dPL = Math.max(0, Math.round((-m.axis[0] - r) * 2) / 2); ns.dPV = Math.max(0, Math.round((m.axis[1] - r) * 2) / 2); ns.z0 = m.z1;
    S.solids.push(ns); S.act = S.solids.length - 1; changed(); return;
  }
  if (b.dataset.a === 'del') { S.solids.splice(S.act, 1); S.act = Math.max(0, S.act - 1); changed(); return; }
  if (b.dataset.a === 'ontop') { sd.z0 = topOfOthers(S.act); changed(); return; }
  if (b.dataset.t) { if (b.dataset.t === 'sec') S.sec.on = !S.sec.on; else if (b.dataset.t === 'cut') S.sec.cut = !S.sec.cut; else S[b.dataset.t] = !S[b.dataset.t]; changed(); return; }
  const k = b.dataset.k, dv = +b.dataset.d; if (!k) return;
  if (k.startsWith('d.')) { const dk = k.slice(2), d = dimsOf(sd); d[dk] = clamp(Math.round((d[dk] + dv) * 10) / 10, 0.5, 20); }
  else if (k === 'rot') sd.rot = clamp(sd.rot + dv, -90, 90);
  else if (k === 'sec.pos') S.sec.pos = clamp(Math.round((S.sec.pos + dv) * 10) / 10, 0, 40);
  else if (k === 'sec.ang') S.sec.ang = clamp(S.sec.ang + dv, 5, 85);
  else sd[k] = clamp(Math.round((sd[k] + dv) * 10) / 10, 0, 20);
  changed();
});
// cambiando tipo, il solido resta centrato dov'era (così un solido appoggiato sopra un altro rimane sul suo asse)
const centerOf = sd => { const m = buildSolid(sd), xs = m.V.map(p => p[0]), ys = m.V.map(p => p[1]); return [(Math.min(...xs) + Math.max(...xs)) / 2, (Math.min(...ys) + Math.max(...ys)) / 2]; };
document.querySelectorAll('.sol').forEach(b => b.onclick = () => {
  const sd = S.solids[S.act], c0 = centerOf(sd); sd.kind = b.dataset.s; const c1 = centerOf(sd);
  sd.dPL = Math.max(0, Math.round((sd.dPL - (c0[0] - c1[0])) * 100) / 100); sd.dPV = Math.max(0, Math.round((sd.dPV + (c0[1] - c1[1])) * 100) / 100);
  changed();
});

/* ---------- apertura dei piani ---------- */
const openR = $('#open');
function setOpen(v) { S.open = clamp(v, 0, 90); openR.value = Math.round(S.open); $('#openV').textContent = Math.round(S.open) + '°'; $('#playLbl').textContent = S.open >= 89.5 ? 'Chiudi i piani' : 'Apri i piani'; draw(); }
openR.addEventListener('input', () => { anim = null; setOpen(+openR.value); });
$('#playBtn').onclick = () => animate({ open: S.open >= 89.5 ? 0 : 90 });
function animate(target, ms) {
  const from = { open: S.open, yaw: CAM.yaw, pitch: CAM.pitch }, t0 = performance.now(), dur = ms || 2200, me = {}; anim = me;
  const step = now => { if (anim !== me) return; const k = clamp((now - t0) / dur, 0, 1), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    if ('open' in target) setOpen(from.open + (target.open - from.open) * e);
    if ('yaw' in target) { CAM.yaw = from.yaw + (target.yaw - from.yaw) * e; CAM.pitch = from.pitch + (target.pitch - from.pitch) * e; B = basis(); draw(); }
    if (k < 1) requestAnimationFrame(step); else anim = null; };
  requestAnimationFrame(step);
}
$('#viewFront').onclick = () => animate({ yaw: 0, pitch: 0 }, 1000);
$('#view3d').onclick = () => { CAM.zoom = 1; CAM.px = CAM.py = 0; animate({ yaw: 38, pitch: 24 }, 1000); };

/* ---------- gesti: un dito gira il triedro, due dita ingrandiscono e spostano ---------- */
const pts = new Map(); let g0 = null;
function snap() { const P = [...pts.values()]; return { P: P.map(p => ({ ...p })), yaw: CAM.yaw, pitch: CAM.pitch, zoom: CAM.zoom, px: CAM.px, py: CAM.py }; }
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); g0 = snap(); anim = null; $('#hint').hidden = true; });
cv.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const P = [...pts.values()];
  if (P.length === 1 && g0.P.length === 1) { CAM.yaw = clamp(g0.yaw - (P[0].x - g0.P[0].x) * 0.35, 0, 90); CAM.pitch = clamp(g0.pitch + (P[0].y - g0.P[0].y) * 0.35, 0, 89); B = basis(); }
  else if (P.length >= 2 && g0.P.length >= 2) {
    const d0 = Math.hypot(g0.P[0].x - g0.P[1].x, g0.P[0].y - g0.P[1].y), d1 = Math.hypot(P[0].x - P[1].x, P[0].y - P[1].y);
    CAM.zoom = clamp(g0.zoom * d1 / Math.max(d0, 1), 0.4, 5);
    CAM.px = g0.px + ((P[0].x + P[1].x) - (g0.P[0].x + g0.P[1].x)) / 2; CAM.py = g0.py + ((P[0].y + P[1].y) - (g0.P[0].y + g0.P[1].y)) / 2;
  }
  draw();
});
const up = e => { pts.delete(e.pointerId); g0 = snap(); };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('wheel', e => { e.preventDefault(); CAM.zoom = clamp(CAM.zoom * Math.exp(-e.deltaY * 0.0015), 0.4, 5); draw(); }, { passive: false });
cv.addEventListener('dblclick', () => { CAM.zoom = 1; CAM.px = CAM.py = 0; draw(); });

$('#fsBtn').onclick = () => { const el = document.documentElement; try { document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen(); } catch (_) { } };
new ResizeObserver(layout).observe(stage);
rebuild(); lastSize = JSON.stringify(scene()); renderSide(); setOpen(0); layout();
setTimeout(() => { $('#hint').style.opacity = 0; setTimeout(() => $('#hint').hidden = true, 700); }, 7000);
window.PR = { S, CAM, setOpen, changed, get CUT() { return CUT; }, get MESH() { return MESH; }, edgesSeen, VIEWS, seen: n => seen(n) };
})();
</script>
